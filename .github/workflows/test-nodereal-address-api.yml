name: 测试NodeReal地址历史API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-nodereal-address-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 测试增强地址查询
        run: |
          python3 - <<'PY'
          import requests, json
          url='https://bsc-mainnet.nodereal.io/v1/f8728a3265504b998a2f09c83493d76a'
          addr='0xf5a248f6139f0ab0fab0c4dda6043b840f927777'
          p={'jsonrpc':'2.0','id':1,'method':'nr_getTransactionByAddress','params':[{'category':['external'],'addressType':'to','address':addr,'order':'desc','excludeZeroValue':False,'maxCount':'0x5','toBlock':'latest'}]}
          r=requests.post(url,json=p,timeout=30)
          print('http',r.status_code)
          print(r.text[:2000])
          if r.status_code!=200:
              raise SystemExit(1)
          d=r.json()
          if d.get('error'):
              raise SystemExit(2)
          print('NODE_REAL_ADDRESS_API_OK')
          PY
