name: 诊断钱包雷达实时状态

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-wallet-radar-live.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 只读诊断钱包雷达
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            echo "=== service ==="
            systemctl is-active wallet-radar-bot.service || true
            systemctl show wallet-radar-bot.service -p MainPID -p NRestarts -p ActiveEnterTimestamp --no-pager || true
            echo "=== process ==="
            ps -eo pid,ppid,etime,stat,cmd | grep -E "wallet-radar/(telegram_console|telegram_bot|main)\.py|main.py analyze" | grep -v grep || true
            echo "=== recent journal ==="
            journalctl -u wallet-radar-bot.service --since "20 minutes ago" --no-pager | tail -n 220 || true
            echo "=== reports ==="
            find /opt/wallet-radar/reports -maxdepth 1 -type f -printf "%TY-%Tm-%Td %TH:%TM:%TS %s %f\n" 2>/dev/null | sort | tail -n 20 || true
            echo "=== env rpc keys (masked) ==="
            grep -E "^(ROBINHOOD_RPC_URL|HYPEREVM_RPC_URL|BNB_RPC_URL|BNB_LOG_CHUNK|REQUEST_TIMEOUT|RPC_BATCH_SIZE)=" /opt/wallet-radar/.env 2>/dev/null | sed -E "s#(https://[^/]+/v1/)[A-Za-z0-9_-]+#\1***#" || true
            echo "=== hyper isolation read-only ==="
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null || true
          '
