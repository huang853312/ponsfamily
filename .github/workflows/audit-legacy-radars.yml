name: Audit legacy multi-chain radars

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-legacy-radars.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-legacy-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Read-only audit of legacy radar execution paths
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -u
            echo "=== LEGACY SERVICE UNIT FILES ==="
            systemctl list-unit-files --type=service --no-pager | grep -Ei "bnb|bsc|robinhood|hyper.*radar|radar.*hyper" || true

            echo "=== LEGACY SERVICE RUNTIME STATE ==="
            for svc in robinhood-radar.service bnb-radar.service bsc-radar.service bnbchain-radar.service bscchain-radar.service; do
              echo "--- $svc ---"
              systemctl is-active "$svc" 2>/dev/null || true
              systemctl is-enabled "$svc" 2>/dev/null || true
            done

            echo "=== ALL RADAR / CHAIN PROCESSES ==="
            ps -eo pid,ppid,lstart,cmd --sort=pid | grep -Ei "python|node|bash|sh" | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" | grep -v grep || true

            echo "=== SYSTEMD TIMERS ==="
            systemctl list-timers --all --no-pager | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" || true

            echo "=== USER CRONTAB ==="
            crontab -l 2>/dev/null | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" || true

            echo "=== ROOT CRONTAB ==="
            sudo crontab -l 2>/dev/null | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" || true

            echo "=== /etc/cron* REFERENCES ==="
            sudo grep -RniE "bnb|bsc|robinhood|hyperevm|radar" /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/cron.weekly /etc/cron.monthly 2>/dev/null || true

            echo "=== DOCKER CONTAINERS ==="
            if command -v docker >/dev/null 2>&1; then
              sudo docker ps -a --format "{{.ID}} {{.Names}} {{.Status}} {{.Image}} {{.Command}}" | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" || true
            else
              echo "docker not installed"
            fi

            echo "=== SCREEN SESSIONS ==="
            if command -v screen >/dev/null 2>&1; then screen -ls 2>/dev/null | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" || true; else echo "screen not installed"; fi

            echo "=== TMUX SESSIONS ==="
            if command -v tmux >/dev/null 2>&1; then tmux ls 2>/dev/null | grep -Ei "bnb|bsc|robinhood|hyperevm|radar" || true; else echo "tmux not installed"; fi

            echo "=== PROTECTED CURRENT HYPEREVM ==="
            echo -n "active="; systemctl is-active hyperevm-radar.service 2>/dev/null || true
            echo -n "enabled="; systemctl is-enabled hyperevm-radar.service 2>/dev/null || true
            systemctl show hyperevm-radar.service -p MainPID -p ExecMainStartTimestamp -p NRestarts -p FragmentPath --no-pager 2>/dev/null || true
          '
