name: Deploy X Follow Monitor

on:
  push:
    branches:
      - main
    paths:
      - "x-follow-monitor/**"
      - ".github/workflows/deploy-x-follow-monitor.yml"
  workflow_dispatch:

concurrency:
  group: deploy-x-follow-monitor-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test monitor
        working-directory: x-follow-monitor
        run: |
          python3 -m py_compile app.py
          python3 -m unittest -v

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up and deploy monitor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          XAPI_KEY: ${{ secrets.XAPI_KEY }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          if test -n "$XAPI_KEY"; then
            { printf 'XAPI_KEY='; printf '%s' "$XAPI_KEY"; printf '\n'; } | \
              $SSH "$SERVER_USER@$SERVER_HOST" 'umask 077; cat > /tmp/x-follow-xapi.env'
          fi

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -e
            install -d /home/ubuntu/ponsfamily/x-follow-monitor
            if test -f /home/ubuntu/ponsfamily/x-follow-monitor/app.py; then
              cp /home/ubuntu/ponsfamily/x-follow-monitor/app.py "/home/ubuntu/ponsfamily/x-follow-monitor/app.py.backup.$(date -u +%Y%m%dT%H%M%SZ)"
            fi
          '

          rsync -az --delete \
            --exclude='state.json' \
            --exclude='node_modules/' \
            --exclude='.venv/' \
            --exclude='*.backup.*' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "$SSH" \
            x-follow-monitor/ \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/ponsfamily/x-follow-monitor/"

      - name: Restart and verify service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -e
            cd /home/ubuntu/ponsfamily/x-follow-monitor
            python3 -m py_compile app.py
            sudo systemctl stop x-follow-monitor.service 2>/dev/null || true
            sudo python3 - <<"PY"
          import os
          import re
          from pathlib import Path

          target = Path("/home/ubuntu/ponsfamily/x-follow-monitor/.env")
          wanted = ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "XAPI_KEY")
          found = {}
          sources = {}
          candidates = [
              target,
              Path("/home/ubuntu/ponsfamily/.env"),
              Path("/home/ubuntu/.env"),
              Path("/home/ubuntu/x-follow-monitor/.env"),
              Path("/opt/hyperevm-radar/.env"),
              Path("/opt/robinhood-radar/.env"),
              Path("/etc/robinhood-radar.env"),
              Path("/tmp/x-follow-xapi.env"),
          ]
          allowed_names = {".env", ".profile", ".bashrc"}
          allowed_suffixes = {".env", ".service", ".conf", ".config", ".sh"}
          skipped = {"node_modules", ".git", ".venv", "__pycache__"}
          for root in (Path("/home/ubuntu"), Path("/opt"), Path("/etc/systemd")):
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or any(part in skipped for part in path.parts):
                      continue
                  if path.name not in allowed_names and path.suffix not in allowed_suffixes:
                      continue
                  candidates.append(path)

          direct = re.compile(r"^\s*(?:export\s+)?(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|XAPI_KEY)\s*=\s*(.*?)\s*$")
          unit = re.compile(r"^\s*Environment\s*=\s*[\"\x27]?(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|XAPI_KEY)=(.*?)[\"\x27]?\s*$")
          seen = set()
          for path in candidates:
              try:
                  resolved = path.resolve()
                  if resolved in seen or path.stat().st_size > 1_000_000:
                      continue
                  seen.add(resolved)
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except (OSError, RuntimeError):
                  continue
              for line in text.splitlines():
                  match = direct.match(line) or unit.match(line)
                  if not match:
                      continue
                  key, value = match.groups()
                  if value and key not in found:
                      found[key] = value
                      sources[key] = str(path)

          missing = [key for key in wanted if key not in found]
          print("credential_sources=" + ",".join(f"{key}:{sources[key]}" for key in wanted if key in sources))
          if missing:
              raise SystemExit("missing_credentials=" + ",".join(missing))

          target.parent.mkdir(parents=True, exist_ok=True)
          temp = target.with_suffix(".env.tmp")
          temp.write_text("".join(f"{key}={found[key]}\n" for key in wanted), encoding="utf-8")
          os.chmod(temp, 0o600)
          os.replace(temp, target)
          Path("/tmp/x-follow-xapi.env").unlink(missing_ok=True)
          PY
            sudo install -m 0644 x-follow-monitor.service /etc/systemd/system/x-follow-monitor.service
            sudo systemctl daemon-reload
            sudo systemctl enable x-follow-monitor.service
            sudo systemctl restart x-follow-monitor.service

            for attempt in $(seq 1 10); do
              if sudo systemctl is-active --quiet x-follow-monitor.service; then
                break
              fi
              sleep 3
            done

            sudo systemctl is-active --quiet x-follow-monitor.service
            sleep 15

            set +e
            active_state=$(sudo systemctl is-active x-follow-monitor.service)
            active_rc=$?
            main_pid=$(sudo systemctl show x-follow-monitor.service -p MainPID --value)
            service_result=$(sudo systemctl show x-follow-monitor.service -p Result --value)
            exec_status=$(sudo systemctl show x-follow-monitor.service -p ExecMainStatus --value)
            sudo systemctl status x-follow-monitor.service --no-pager
            sudo journalctl -u x-follow-monitor.service --since "2 minutes ago" --no-pager
            set -e

            printf "active=%s pid=%s result=%s exit=%s\n" \
              "$active_state" "$main_pid" "$service_result" "$exec_status"
            test "$active_rc" -eq 0
            test "$active_state" = "active"
            test "$main_pid" != "0"
            test "$service_result" = "success"

            python3 - <<"PY"
          import json
          from pathlib import Path
          state = json.loads(Path("/home/ubuntu/ponsfamily/x-follow-monitor/state.json").read_text())
          print("monitor_state=" + json.dumps({
              "account_count": len(state.get("accounts") or []),
              "running": bool(state.get("running")),
              "offset": int(state.get("offset", 0)),
          }, ensure_ascii=False))
          PY

            sudo python3 - <<"PY"
          import json
          from pathlib import Path
          from urllib import parse, request
          env = {}
          for line in Path("/home/ubuntu/ponsfamily/x-follow-monitor/.env").read_text().splitlines():
              if line and not line.lstrip().startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  env[key.strip()] = value.strip().strip("\"")
          data = parse.urlencode({
              "chat_id": env["TELEGRAM_CHAT_ID"],
              "text": "X关注监控自检成功：机器人发送通道正常。",
          }).encode()
          url = f"https://api.telegram.org/bot{env['TELEGRAM_BOT_TOKEN']}/sendMessage"
          with request.urlopen(url, data=data, timeout=30) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise SystemExit("telegram_outbound=FAILED")
          print("telegram_outbound=OK")
          PY
          '
