name: Deploy X Follow Monitor

on:
  push:
    branches:
      - main
    paths:
      - "x-follow-monitor/**"
      - ".github/workflows/deploy-x-follow-monitor.yml"
  workflow_dispatch:

concurrency:
  group: deploy-x-follow-monitor-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          test -n "$TWITTERAPI_IO_KEY"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test monitor
        working-directory: x-follow-monitor
        run: |
          python3 -m py_compile app.py
          python3 -m unittest -v

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up and deploy monitor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -e
            install -d /home/ubuntu/ponsfamily/x-follow-monitor
            if test -f /home/ubuntu/ponsfamily/x-follow-monitor/app.py; then
              cp /home/ubuntu/ponsfamily/x-follow-monitor/app.py "/home/ubuntu/ponsfamily/x-follow-monitor/app.py.backup.$(date -u +%Y%m%dT%H%M%SZ)"
            fi
          '

          rsync -az --delete \
            --exclude='state.json' \
            --exclude='*.backup.*' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "$SSH" \
            x-follow-monitor/ \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/ponsfamily/x-follow-monitor/"

      - name: Install secret and restart service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          {
            printf 'TWITTERAPI_IO_KEY=%s\n' "$TWITTERAPI_IO_KEY"
            printf 'X_FOLLOW_INTERVAL=3600\n'
          } | $SSH "$SERVER_USER@$SERVER_HOST" 'sudo tee /etc/x-follow-monitor.env >/dev/null && sudo chmod 600 /etc/x-follow-monitor.env'

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -e
            cd /home/ubuntu/ponsfamily/x-follow-monitor
            python3 -m py_compile app.py
            sudo install -m 0644 x-follow-monitor.service /etc/systemd/system/x-follow-monitor.service
            sudo systemctl daemon-reload
            sudo systemctl enable x-follow-monitor.service
            sudo systemctl restart x-follow-monitor.service

            for attempt in $(seq 1 10); do
              if sudo systemctl is-active --quiet x-follow-monitor.service; then
                break
              fi
              sleep 3
            done

            sudo systemctl is-active --quiet x-follow-monitor.service
            sudo systemctl status x-follow-monitor.service --no-pager
            sudo journalctl -u x-follow-monitor.service -n 30 --no-pager
          '
