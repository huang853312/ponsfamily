name: 确认钱包雷达已彻底删除

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-wallet-radar-purged.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 只读复核删除结果
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            echo "=== Wallet Radar 文件 ==="
            for f in main.py main_fast.py telegram_bot.py telegram_console.py test_fast_equivalence.py requirements.txt labels.json README.md .env .env.example; do
              if [ -e "/opt/wallet-radar/$f" ]; then
                echo "仍存在: /opt/wallet-radar/$f"
                exit 1
              fi
            done
            echo "运行代码和配置=不存在"

            echo "=== Wallet Radar 服务 ==="
            active=$(systemctl is-active wallet-radar-bot.service 2>/dev/null || true)
            enabled=$(systemctl is-enabled wallet-radar-bot.service 2>/dev/null || true)
            echo "active=$active"
            echo "enabled=$enabled"
            test "$active" != active
            test "$enabled" = masked

            echo "=== Wallet Radar Python 进程 ==="
            if ps -eo comm=,args= | awk '$1 ~ /^python/ && $0 ~ /\/opt\/wallet-radar\// {print; found=1} END {exit found ? 0 : 1}'; then
              echo "仍存在 Wallet Radar Python 进程"
              exit 1
            fi
            echo "Python进程=无"

            echo "=== 原主雷达 ==="
            test "$(systemctl is-active hyperevm-radar.service)" = active
            test "$(systemctl is-active robinhood-radar.service)" = active
            echo "HyperEVM=active"
            echo "Robinhood=active"
            echo "VERIFY_WALLET_RADAR_PURGED_OK"
          '
