name: Delete BNB radar completely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-bnb-radar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-bnb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Delete BNB radar service and files only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            echo "=== DELETE BNB ONLY ==="
            sudo systemctl disable --now bnb-stockfi-radar.service 2>/dev/null || true
            sudo rm -f /etc/systemd/system/bnb-stockfi-radar.service
            sudo rm -f /lib/systemd/system/bnb-stockfi-radar.service
            sudo rm -f /usr/lib/systemd/system/bnb-stockfi-radar.service
            sudo systemctl daemon-reload
            sudo systemctl reset-failed bnb-stockfi-radar.service 2>/dev/null || true

            # Remove only directories whose names explicitly identify the BNB radar.
            for d in /opt/bnb-stockfi-radar /opt/bnb-radar /opt/bsc-radar /opt/bnbchain-radar /opt/bscchain-radar; do
              if [ -e "$d" ]; then
                echo "Removing $d"
                sudo rm -rf -- "$d"
              fi
            done

            echo "=== VERIFY BNB REMOVED ==="
            systemctl list-unit-files --type=service --no-pager | grep -Ei "bnb|bsc" || true
            ps -eo pid,cmd | grep -Ei "bnb-stockfi-radar|/opt/(bnb|bsc).*radar" | grep -v grep || true
            ls -ld /opt/bnb-stockfi-radar /opt/bnb-radar /opt/bsc-radar /opt/bnbchain-radar /opt/bscchain-radar 2>/dev/null || true

            echo "=== PROTECTED HYPEREVM STATUS ==="
            echo -n "active="; systemctl is-active hyperevm-radar.service
            echo -n "enabled="; systemctl is-enabled hyperevm-radar.service
          '
