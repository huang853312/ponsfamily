name: Read-only X Follow Recovery Check - verify post-fix production scan

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-x-follow-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read X monitor config and state without changing anything
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" 'sudo python3 -' <<'PY'
          import hashlib, json, subprocess, time
          from pathlib import Path
          root=Path("/home/ubuntu/ponsfamily/x-follow-monitor")
          envp=root/".env"
          print("env_file_exists="+str(envp.is_file()).lower())
          if envp.is_file():
              cfg={}
              for line in envp.read_text(encoding="utf-8",errors="ignore").splitlines():
                  if "=" in line and not line.lstrip().startswith("#"):
                      k,v=line.split("=",1)
                      cfg[k.strip()]=v.strip().strip(chr(34)).strip(chr(39))
              for name in ("TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","XAPI_KEY"):
                  value=cfg.get(name,"")
                  print(name.lower()+"_present="+str(bool(value)).lower())
                  if value:
                      print(name.lower()+"_fingerprint="+hashlib.sha256(value.encode()).hexdigest()[:12])
          try:
              s=json.loads((root/"state.json").read_text(encoding="utf-8"))
              print("accounts="+str(len(s.get("accounts") or [])))
              print("billing_policy_version="+str(s.get("billing_policy_version",0)))
              print("api_pause_until_epoch="+str(int(float(s.get("api_pause_until",0) or 0))))
              print("running_flag="+str(bool(s.get("running"))).lower())
              print("last_scan_result="+str(s.get("last_scan_result") or "none"))
              print("last_scan_epoch="+str(int(float(s.get("last_scan_at",0) or 0))))
              print("now_epoch="+str(int(time.time())))
              print("scan_ok="+str(s.get("last_scan_ok_accounts",0)))
              print("scan_failed="+str(s.get("last_scan_failed_accounts",0)))
              print("api_pause_reason="+str(s.get("api_pause_reason") or "none"))
              print("api_pause_active="+str(float(s.get("api_pause_until",0) or 0)>time.time()).lower())
              print("pending_notifications="+str(len(s.get("pending_notifications") or [])))
          except Exception as exc:
              print("state_read_failed="+type(exc).__name__)
          if envp.is_file():
              try:
                  cli=root/"node_modules"/".bin"/"xapi-to"
                  xkey=cfg.get("XAPI_KEY","")
                  if cli.is_file() and xkey:
                      import os, re
                      child_env=dict(os.environ)
                      child_env["XAPI_KEY"]=xkey
                      child_env.pop("XAPI_API_KEY",None)
                      for label,args in (
                          ("post_scan_balance",[str(cli),"balance"]),
                          ("post_scan_key_health",[str(cli),"config","health"]),
                      ):
                          try:
                              p=subprocess.run(args,cwd=str(root),env=child_env,capture_output=True,text=True,timeout=25,check=False)
                              raw=((p.stdout or "")+"\\n"+(p.stderr or "")).replace(xkey,"<redacted>")
                              raw=re.sub(r"(?i)(sk-xapi-[A-Za-z0-9_-]+)","<redacted-key>",raw)
                              try:
                                  obj=json.loads(raw.strip())
                                  selected={}
                                  def collect(value):
                                      if isinstance(value,dict):
                                          for key2,val in value.items():
                                              if str(key2).lower() in ("balance","status","code","success","message","error"):
                                                  selected[key2]=val if not isinstance(val,(dict,list)) else type(val).__name__
                                              if isinstance(val,dict): collect(val)
                                      elif isinstance(value,list):
                                          for val in value[:10]:
                                              if isinstance(val,dict): collect(val)
                                  collect(obj)
                                  print(label+"_fields="+json.dumps(selected,ensure_ascii=False)[:1200])
                              except Exception:
                                  print(label+"_response="+raw.strip()[:400].replace(chr(10)," "))
                          except subprocess.TimeoutExpired:
                              print(label+"_result=timeout")
              except Exception as exc:
                  print("post_scan_billing_probe_error="+type(exc).__name__)
          # Read-only pagination probe for one account that failed in the full scan.
          # Log page/error metadata only; never print cursors, API keys, or user rows.
          try:
              import urllib.request, urllib.error
              state_obj=json.loads((root/"state.json").read_text(encoding="utf-8"))
              ids=state_obj.get("ids") or {}
              probe_name="jerallaire"
              probe_uid=ids.get(probe_name)
              if not probe_uid:
                  raise RuntimeError("probe account has no cached user ID")
              cursor=""
              page_successes=0
              for page_number in range(1,101):
                  call_input={"user_id":str(probe_uid),"provider":"x"}
                  if cursor: call_input["cursor"]=cursor
                  req_body=json.dumps({"action_id":"twitter.following","input":call_input}).encode("utf-8")
                  req=urllib.request.Request("https://action.xapi.to/v1/actions/execute",data=req_body,headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"undici","XAPI-Key":cfg.get("XAPI_KEY","")},method="POST")
                  status=None; headers={}; raw=b""
                  try:
                      with urllib.request.urlopen(req,timeout=60) as response:
                          status=response.status; headers=response.headers; raw=response.read()
                  except urllib.error.HTTPError as exc:
                      status=exc.code; headers=exc.headers; raw=exc.read()
                  try: payload=json.loads(raw.decode("utf-8",errors="replace"))
                  except Exception: payload={}
                  err_obj=payload.get("error") if isinstance(payload,dict) else None
                  if not isinstance(err_obj,dict): err_obj={}
                  data=payload.get("data") if isinstance(payload,dict) else None
                  success=isinstance(payload,dict) and payload.get("success") is True and isinstance(data,dict)
                  code=str(err_obj.get("code") or payload.get("code") or "none") if isinstance(payload,dict) else "non_json"
                  message=str(err_obj.get("message") or payload.get("message") or "")[:180] if isinstance(payload,dict) else ""
                  if not success:
                      print("pagination_probe account=@"+probe_name+" page="+str(page_number)+" http_status="+str(status)
                            +" success=false code="+code+" source="+str(headers.get("X-XAPI-Source") or "missing")
                            +" request_id="+str(headers.get("X-XAPI-Request-Id") or "missing")
                            +" routing_attempts="+str(headers.get("X-Routing-Attempts") or "missing")
                            +" message="+message)
                      break
                  users=data.get("users")
                  if not isinstance(users,list):
                      print("pagination_probe account=@"+probe_name+" page="+str(page_number)+" success=false code=missing_users")
                      break
                  page_successes+=1
                  next_cursor=data.get("cursor_bottom")
                  if not next_cursor:
                      cursors=data.get("cursors")
                      next_cursor=cursors.get("bottom") if isinstance(cursors,dict) else ""
                  print("pagination_probe account=@"+probe_name+" page="+str(page_number)+" http_status="+str(status)+" success=true users="+str(len(users)))
                  if not users or not next_cursor:
                      print("pagination_probe_complete account=@"+probe_name+" pages="+str(page_successes))
                      break
                  cursor=str(next_cursor)
              else:
                  print("pagination_probe_stop account=@"+probe_name+" reason=page_cap pages=100")
          except Exception as exc:
              print("pagination_probe_exception="+type(exc).__name__+":"+str(exc)[:160])

          for prop in ("ActiveState","MainPID","Result","NRestarts"):
              out=subprocess.run(["systemctl","show","x-follow-monitor.service","-p",prop,"--value"],capture_output=True,text=True)
              print("service_"+prop.lower()+"="+out.stdout.strip())
          pid=subprocess.run(["systemctl","show","x-follow-monitor.service","-p","MainPID","--value"],capture_output=True,text=True).stdout.strip()
          if pid and pid!="0":
              try:
                  runtime={}
                  for item in Path("/proc/"+pid+"/environ").read_bytes().split(bytes([0])):
                      if b"=" in item:
                          k,v=item.split(b"=",1)
                          runtime[k.decode(errors="ignore")]=v.decode(errors="ignore")
                  token=runtime.get("TELEGRAM_BOT_TOKEN","")
                  chat=runtime.get("TELEGRAM_CHAT_ID","")
                  print("runtime_telegram_token_present="+str(bool(token)).lower())
                  if token: print("runtime_telegram_token_fingerprint="+hashlib.sha256(token.encode()).hexdigest()[:12])
                  print("runtime_telegram_chat_present="+str(bool(chat)).lower())
              except Exception as exc:
                  print("runtime_env_read_failed="+type(exc).__name__)
          print("--- recent x-follow service logs ---")
          logs=subprocess.run(["journalctl","-u","x-follow-monitor.service","--since","10 minutes ago","--no-pager"],capture_output=True,text=True)
          for row in logs.stdout.splitlines():
              if any(tag in row for tag in ("SCAN_SUMMARY","SCAN_OK","XAPI_BILLING_PAUSE","XAPI_ACCOUNT_402","XAPI_ACCOUNT_402_ISOLATED","BILLING_PAUSE_CLEARED_AFTER_POLICY_MIGRATION","XAPI_TRANSIENT_RETRY","XAPI_TRANSIENT_NETWORK","STARTUP_PURGED_LEGACY_PROXY_ALERTS","STARTUP_PURGED_DUPLICATE_BILLING_ALERTS","STARTUP_PURGED_STALE_TELEGRAM_TIMEOUT_ALERTS","TELEGRAM_POLL_TIMEOUT","TELEGRAM_POLL_RECOVERED","NOTICE_SENT","NOTICE_QUEUED","COMMAND_RECEIVED","Traceback","ERROR","Unable to record")):
                  print(row[-350:])
          PY
