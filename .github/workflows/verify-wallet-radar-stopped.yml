name: 确认钱包雷达已停用

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-wallet-radar-stopped.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 只读确认停用状态
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            echo "=== Wallet Radar ==="
            active=$(systemctl is-active wallet-radar-bot.service 2>/dev/null || true)
            enabled=$(systemctl is-enabled wallet-radar-bot.service 2>/dev/null || true)
            echo "active=$active"
            echo "enabled=$enabled"

            echo "=== Wallet Radar 进程 ==="
            if pgrep -af "/opt/wallet-radar/.*(main|main_fast|telegram_console|telegram_bot)\.py"; then
              echo "WALLET_RADAR_PROCESS_PRESENT"
              exit 1
            else
              echo "WALLET_RADAR_PROCESS_NONE"
            fi

            test "$active" != active
            test "$enabled" != enabled

            echo "=== 主雷达只读确认 ==="
            echo -n "HyperEVM="; systemctl is-active hyperevm-radar.service
            echo -n "Robinhood="; systemctl is-active robinhood-radar.service

            echo "=== 资源 ==="
            free -h
            echo "VERIFY_STOPPED_OK"
          '
