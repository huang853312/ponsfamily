name: Apply Identity and Token Strong Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-identity-token-strong-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply identity and token discovery patch
        run: python3 hyperevm-radar/tools/apply_identity_token_strong_fix.py
      - name: Verify radar
        run: |
          python3 -m pip install --disable-pip-version-check aiohttp requests web3
          cd hyperevm-radar
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m compileall -q .
      - name: Commit repaired runtime
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hyperevm-radar/platform_family_intelligence.py hyperevm-radar/tests/test_identity_token_strong.py
          git commit -m "Strengthen identity and early token discovery"
          git push origin HEAD:main
