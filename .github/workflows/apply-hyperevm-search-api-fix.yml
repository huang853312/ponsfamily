name: Apply HyperEVM Search API Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-hyperevm-search-api-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-hyperevm-radar-production
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fd3365d36adad843913143445edc33afc834f05f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test adapter request formats
        run: |
          python -m pip install --disable-pip-version-check requests aiohttp web3
          cd hyperevm-radar
          PYTHONPATH=. python -m unittest discover -s tests -p test_search_api_adapters.py -v
          python -m compileall -q platform_family_intelligence.py
      - name: Extract search-only patch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('hyperevm-radar/platform_family_intelligence.py').read_text()
          block=s[s.index('class ConfiguredJsonSearchProvider('):s.index('class _Links(')]
          Path('search-patch.json').write_text(json.dumps({'block':block}))
          PY
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Apply search-only patch and verify live APIs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new search-patch.json "$SERVER_USER@$SERVER_HOST:/tmp/hyperevm-search-patch-$GITHUB_RUN_ID.json"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" "sudo /opt/hyperevm-radar/.venv/bin/python - /tmp/hyperevm-search-patch-$GITHUB_RUN_ID.json" <<'PY'
          import ast,copy,importlib.util,json,os,subprocess,sys,time
          from pathlib import Path
          sys.dont_write_bytecode=True
          pid=subprocess.check_output(['systemctl','show','hyperevm-radar.service','-p','MainPID','--value'],text=True).strip()
          if not pid.isdigit() or pid=='0':raise RuntimeError('Radar process unavailable')
          for raw in Path('/proc/'+pid+'/environ').read_bytes().split(b'\0'):
              if b'=' in raw:
                  k,v=raw.split(b'=',1);os.environ[k.decode()]=v.decode()
          p=Path('/opt/hyperevm-radar/platform_family_intelligence.py')
          old=p.read_text()
          payload_path=Path(sys.argv[1]);block=json.loads(payload_path.read_text())['block']
          start=old.index('class ConfiguredJsonSearchProvider(');end=old.index('class _Links(',start)
          fixed=old[:start]+block+'\n'+old[end:]
          tree=ast.parse(fixed)
          composite=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='CompositeSearchProvider')
          init=next(n for n in composite.body if isinstance(n,ast.FunctionDef) and n.name=='__init__')
          lines=fixed.splitlines(keepends=True)
          lines[init.lineno-1:init.end_lineno]=['    def __init__(self, providers=None):\n','        self.providers=providers or (ConfiguredJsonSearchProvider(), YouSearchProvider(), ExaSearchProvider(), TinyFishSearchProvider(), DuckDuckGoSearchProvider(), BingSearchProvider())\n']
          fixed=''.join(lines)
          def business_ast(source):
              tree=ast.parse(source)
              names={'ConfiguredJsonSearchProvider','YouSearchProvider','ExaSearchProvider','TinyFishSearchProvider'}
              tree.body=[n for n in tree.body if not (isinstance(n,ast.ClassDef) and n.name in names)]
              for n in tree.body:
                  if isinstance(n,ast.ClassDef) and n.name=='CompositeSearchProvider':
                      n.body=[x for x in n.body if not (isinstance(x,ast.FunctionDef) and x.name=='__init__')]
              return ast.dump(tree,include_attributes=False)
          assert business_ast(old)==business_ast(fixed),'Unexpected business logic change'
          compile(fixed,str(p),'exec')
          spec=importlib.util.spec_from_file_location('searchfix_validation',p)
          module=importlib.util.module_from_spec(spec);sys.modules[spec.name]=module
          exec(compile(fixed,str(p),'exec'),module.__dict__)
          for cls in [module.ConfiguredJsonSearchProvider,module.YouSearchProvider,module.ExaSearchProvider,module.TinyFishSearchProvider]:
              try: hits=cls().search('HyperLend HyperEVM official',10)
              except Exception as exc:
                  print('LIVE_API_FAILURE',cls.__name__,type(exc).__name__,flush=True)
                  raise RuntimeError('Live search validation failed') from None
              print('LIVE_API',cls.__name__,'URL_COUNT',len(hits),flush=True)
              if not hits:raise RuntimeError('Live API returned no URLs')
          hits=module.CompositeSearchProvider().search('HyperLend HyperEVM official',10)
          assert hits
          print('LIVE_DEFAULT_SEARCH URL_COUNT',len(hits),'SOURCE',hits[0].source,flush=True)
          backup=p.with_name(p.name+'.before_search_api_fix_'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime()))
          import shutil
          shutil.copy2(p,backup);st=p.stat()
          temp=p.with_name(p.name+'.searchfix.tmp')
          temp.write_text(fixed);os.chmod(temp,st.st_mode);os.chown(temp,st.st_uid,st.st_gid);os.replace(temp,p)
          print('SEARCH_ONLY_PATCH_APPLIED BUSINESS_AST_UNCHANGED BACKUP',backup.name,flush=True)
          try:
              subprocess.run(['systemctl','restart','hyperevm-radar.service'],check=True)
              time.sleep(15)
              subprocess.run(['systemctl','is-active','--quiet','hyperevm-radar.service'],check=True)
              print(subprocess.check_output(['systemctl','show','hyperevm-radar.service','-p','ActiveState','-p','SubState','-p','NRestarts'],text=True),flush=True)
          except Exception:
              shutil.copy2(backup,p);subprocess.run(['systemctl','restart','hyperevm-radar.service'])
              print('ROLLED_BACK_SEARCH_PATCH',flush=True)
              raise
          payload_path.unlink(missing_ok=True)
          print('DEPLOYMENT_VERIFIED',flush=True)
          PY
      - name: Read post-restart Radar logs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" 'sudo journalctl -u hyperevm-radar.service --since "3 minutes ago" -n 100 --no-pager'
