name: 修复钱包雷达BNB历史RPC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-wallet-radar-bnb-rpc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 固定BNB历史节点并重启钱包雷达电报服务
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null | sort > /tmp/wallet-bnb-hyper-before.txt || true
            cd /opt/wallet-radar
            test -f .env
            if grep -q "^BNB_RPC_URL=" .env; then
              sed -i "s|^BNB_RPC_URL=.*|BNB_RPC_URL=https://bsc-mainnet.nodereal.io/v1/f8728a3265504b998a2f09c83493d76a|" .env
            else
              printf "%s\n" "BNB_RPC_URL=https://bsc-mainnet.nodereal.io/v1/f8728a3265504b998a2f09c83493d76a" >> .env
            fi
            if grep -q "^BNB_LOG_CHUNK=" .env; then
              sed -i "s|^BNB_LOG_CHUNK=.*|BNB_LOG_CHUNK=500|" .env
            else
              printf "%s\n" "BNB_LOG_CHUNK=500" >> .env
            fi
            /opt/wallet-radar/.venv/bin/python /opt/wallet-radar/main.py selftest --chain bnb
            sudo systemctl restart wallet-radar-bot.service
            sleep 4
            test "$(systemctl is-active wallet-radar-bot.service)" = active
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null | sort > /tmp/wallet-bnb-hyper-after.txt || true
            if [ -s /tmp/wallet-bnb-hyper-before.txt ]; then
              diff -u /tmp/wallet-bnb-hyper-before.txt /tmp/wallet-bnb-hyper-after.txt
            fi
            echo "BNB历史RPC已固定；现有HyperEVM Radar未修改或重启。"
          '

      - name: 实测用户BNB代币短区间分析
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            cd /opt/wallet-radar
            timeout 300 .venv/bin/python main.py analyze \
              --chain bnb \
              --token 0xf5a248f6139f0ab0fab0c4dda6043b840f927777 \
              --top 10 \
              --scan-hours 0.05 \
              --funding-minutes 2 \
              --return-minutes 2 \
              --max-groups 2 \
              --output /tmp/wallet-radar-bnb-smoke.csv \
              > /tmp/wallet-radar-bnb-smoke.log 2>&1
            test -s /tmp/wallet-radar-bnb-smoke.csv
            if grep -qiE "403|Forbidden|Archive requests require" /tmp/wallet-radar-bnb-smoke.log; then
              cat /tmp/wallet-radar-bnb-smoke.log
              exit 1
            fi
            tail -n 30 /tmp/wallet-radar-bnb-smoke.log
            echo "BNB真实代币分析已通过，不再出现历史RPC 403。"
          '
