name: Inspect XAPI Billing for X Follow Monitor
# Read-only check of current production runtime; no credentials are printed.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-xapi-billing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read billing state and safely probe xAPI account balance
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" 'sudo python3 -' <<'PY'
          import hashlib, json, os, re, subprocess, time
          from pathlib import Path

          root = Path("/home/ubuntu/ponsfamily/x-follow-monitor")
          envp = root / ".env"
          statep = root / "state.json"
          if not envp.is_file():
              raise SystemExit("billing_probe=stopped_env_missing")
          cfg = {}
          for line in envp.read_text(encoding="utf-8", errors="ignore").splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  k, v = line.split("=", 1)
                  cfg[k.strip()] = v.strip().strip('"').strip("'")
          key = cfg.get("XAPI_KEY", "")
          if not key:
              raise SystemExit("billing_probe=stopped_xapi_key_missing")
          print("active_key_fingerprint=" + hashlib.sha256(key.encode()).hexdigest()[:12])
          print("key_present=true")
          # Check only this monitor's own historical env backups by fingerprint, never print credentials.
          expected_old_fingerprint = "bcd67bd4e288"
          old_key_backup_found = False
          for candidate in root.glob(".env*"):
              if not candidate.is_file() or candidate.name == ".env":
                  continue
              try:
                  for row in candidate.read_text(encoding="utf-8", errors="ignore").splitlines():
                      if row.strip().startswith("XAPI_KEY="):
                          candidate_key = row.split("=", 1)[1].strip().strip('"').strip("'")
                          if candidate_key and hashlib.sha256(candidate_key.encode()).hexdigest()[:12] == expected_old_fingerprint:
                              old_key_backup_found = True
                              print("previous_key_backup_found=true")
                              print("previous_key_backup_file=" + candidate.name)
              except OSError:
                  pass
          if not old_key_backup_found:
              print("previous_key_backup_found=false")
          try:
              state = json.loads(statep.read_text(encoding="utf-8"))
              print("monitored_accounts=" + str(len(state.get("accounts") or [])))
              print("last_scan_result=" + str(state.get("last_scan_result") or "none"))
              print("last_scan_ok=" + str(state.get("last_scan_ok_accounts", 0)))
              print("last_scan_failed=" + str(state.get("last_scan_failed_accounts", 0)))
              print("api_pause_reason=" + str(state.get("api_pause_reason") or "none"))
              print("api_pause_active=" + str(float(state.get("api_pause_until", 0) or 0) > time.time()).lower())
              print("last_scan_age_seconds=" + str(max(0, int(time.time() - float(state.get("last_scan_at", 0) or 0)))))
              billing = (state.get("error_notices") or {}).get("xapi:billing-limit") or {}
              last_error = str(billing.get("last_error") or "").replace(key, "<redacted>")
              last_error = re.sub(r"(?i)(sk-xapi-[A-Za-z0-9_-]+)", "<redacted-key>", last_error)
              print("last_billing_error=" + last_error[:1100].replace(chr(10), " "))
          except Exception as exc:
              print("state_read_error=" + type(exc).__name__)

          cli = root / "node_modules" / ".bin" / "xapi-to"
          if not cli.is_file():
              raise SystemExit("billing_probe=stopped_xapi_cli_missing")
          base_env = dict(os.environ)
          base_env["XAPI_KEY"] = key
          base_env.pop("XAPI_API_KEY", None)
          for name, args in (
              ("account_balance", [str(cli), "balance"]),
              ("api_key_health", [str(cli), "config", "health"]),
          ):
              try:
                  p = subprocess.run(args, cwd=str(root), env=base_env, capture_output=True,
                                     text=True, timeout=35, check=False)
                  raw = (p.stdout or "") + "\n" + (p.stderr or "")
                  # The xAPI key must never appear in emitted logs.
                  raw = raw.replace(key, "<redacted>")
                  raw = re.sub(r"(?i)(sk-xapi-[A-Za-z0-9_-]+)", "<redacted-key>", raw)
                  print(name + "_exit=" + str(p.returncode))
                  try:
                      payload = json.loads(raw.strip())
                      # Emit only billing/connectivity fields from the response.
                      selected = {}
                      def walk(obj, prefix=""):
                          if isinstance(obj, dict):
                              for k, v in obj.items():
                                  path = (prefix + "." + str(k)).strip(".")
                                  if any(t in str(k).lower() for t in (
                                      "balance", "limit", "credit", "usage", "remaining",
                                      "available", "status", "error", "success", "message", "code"
                                  )):
                                      selected[path] = v if not isinstance(v, (dict, list)) else type(v).__name__
                                  if isinstance(v, dict):
                                      walk(v, path)
                          elif isinstance(obj, list):
                              for i, v in enumerate(obj[:10]):
                                  if isinstance(v, dict):
                                      walk(v, prefix + "[" + str(i) + "]")
                      walk(payload)
                      print(name + "_fields=" + json.dumps(selected, ensure_ascii=False)[:2500])
                  except Exception:
                      print(name + "_response=" + raw.strip()[:1500].replace("\n", " "))
              except subprocess.TimeoutExpired:
                  print(name + "_result=timeout")
              except Exception as exc:
                  print(name + "_exception=" + type(exc).__name__)
          # Read-only batch probe: mirrors the monitor's concurrency and captures per-account error metadata only.
          # Does not modify state.json, histories, notification queues, or the service.
          try:
              current_state = json.loads(statep.read_text(encoding="utf-8"))
              probe_accounts = list(dict.fromkeys(current_state.get("accounts") or []))
              probe_ids = current_state.get("ids") or {}
              print("batch_probe_accounts=" + str(len(probe_accounts)))
              print("batch_probe_concurrency=3")
              def parse_probe_payload(stdout):
                  try:
                      obj = json.loads((stdout or "").strip())
                  except Exception:
                      return None, "non_json", ""
                  if not isinstance(obj, dict):
                      return obj, "unexpected_payload", ""
                  err = obj.get("error")
                  if isinstance(err, dict):
                      return obj, str(err.get("code") or "error"), str(err.get("message") or "")[:240]
                  code = str(obj.get("code") or "")
                  message = str(obj.get("message") or "")[:240]
                  if code or obj.get("success") is False:
                      return obj, code or "error", message
                  if obj.get("success") is True and isinstance(obj.get("data"), dict):
                      return obj, "ok", ""
                  if isinstance(obj.get("data"), dict) and "users" in obj.get("data", {}):
                      return obj, "ok", ""
                  return obj, "unexpected_payload", message
              def call_action(action, data):
                  p = subprocess.run(
                      [str(cli), "call", action, "--input", json.dumps(data)],
                      cwd=str(root), env=base_env, capture_output=True, text=True,
                      timeout=60, check=False,
                  )
                  obj, code, message = parse_probe_payload(p.stdout)
                  if p.returncode != 0 and code == "ok":
                      code = "cli_exit_" + str(p.returncode)
                  return p.returncode, obj, code, message
              def probe_one(name):
                  uid = probe_ids.get(name)
                  if not uid:
                      rc, obj, code, message = call_action("twitter.user_by_screen_name", {"screen_name": name, "provider": "x"})
                      if code != "ok": return name, code, message, "user_by_screen_name"
                      data = obj.get("data") if isinstance(obj, dict) else None
                      uid = (data or {}).get("rest_id") or (data or {}).get("id") if isinstance(data, dict) else None
                      if not uid: return name, "missing_user_id", "", "user_by_screen_name"
                  try:
                      rc, obj, code, message = call_action("twitter.following", {"user_id": str(uid), "provider": "x"})
                      if code == "ok":
                          data = obj.get("data") if isinstance(obj, dict) else None
                          users = data.get("users") if isinstance(data, dict) else None
                          return name, "ok", str(len(users)) if isinstance(users, list) else "data_ok", "twitter.following"
                      return name, code, message, "twitter.following"
                  except subprocess.TimeoutExpired:
                      return name, "timeout", "", "twitter.following"
                  except Exception as exc:
                      return name, type(exc).__name__, str(exc)[:160], "twitter.following"
              from concurrent.futures import ThreadPoolExecutor, as_completed
              probe_results = []
              with ThreadPoolExecutor(max_workers=3) as executor:
                  futures = [executor.submit(probe_one, name) for name in probe_accounts]
                  for future in as_completed(futures):
                      try: probe_results.append(future.result())
                      except Exception as exc: probe_results.append(("unknown", type(exc).__name__, str(exc)[:160], "probe"))
              probe_results.sort(key=lambda row: row[0])
              probe_ok = sum(1 for row in probe_results if row[1] == "ok")
              print("batch_probe_ok=" + str(probe_ok))
              print("batch_probe_failed=" + str(len(probe_results) - probe_ok))
              for name, code, detail, action in probe_results:
                  if code == "ok":
                      print("batch_probe_result account=@" + name + " action=" + action + " status=ok detail=" + detail)
                  else:
                      safe_detail = str(detail or "").replace(key, "<redacted>")
                      safe_detail = re.sub(r"(?i)(sk-xapi-[A-Za-z0-9_-]+)", "<redacted-key>", safe_detail)
                      print("batch_probe_result account=@" + name + " action=" + action + " status=" + str(code) + " detail=" + safe_detail[:240])
          except subprocess.TimeoutExpired:
              print("batch_probe_result=timeout")
          except Exception as exc:
              print("batch_probe_exception=" + type(exc).__name__)

          for prop in ("ActiveState", "MainPID", "NRestarts"):
              result = subprocess.run(["systemctl", "show", "x-follow-monitor.service", "-p", prop, "--value"],
                                      capture_output=True, text=True, timeout=10)
              print("service_" + prop.lower() + "=" + result.stdout.strip())
          recent = subprocess.run(["journalctl", "-u", "x-follow-monitor.service", "--since", "3 minutes ago", "--no-pager"],
                                  capture_output=True, text=True, timeout=15)
          print("--- recent monitor runtime evidence ---")
          for row in recent.stdout.splitlines():
              if any(tag in row for tag in ("SCAN_SUMMARY", "XAPI_BILLING_PAUSE", "SCAN_OK", "Traceback", "ERROR")):
                  print(row[-420:])
          PY
