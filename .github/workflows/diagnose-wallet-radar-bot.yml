name: 诊断钱包雷达电报控制台

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-wallet-radar-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 读取钱包雷达电报服务状态
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            echo "=== SERVICE ==="
            systemctl is-active wallet-radar-bot.service || true
            systemctl is-enabled wallet-radar-bot.service || true
            systemctl show wallet-radar-bot.service -p MainPID -p NRestarts -p ActiveEnterTimestamp --no-pager || true
            echo "=== JOURNAL ==="
            journalctl -u wallet-radar-bot.service --since "20 minutes ago" --no-pager -n 200 || true
          '
