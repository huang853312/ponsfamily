name: Deploy Independent Chain Flow Monitor

on:
  push:
    branches: [main]
    paths:
      - 'chain-flow-monitor/**'
      - '.github/workflows/deploy-chain-flow-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-independent-chain-flow-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test independent monitor
        working-directory: chain-flow-monitor
        run: |
          python3 -m unittest -v
          bash -n deploy.sh
      - name: Deploy only independent monitor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/flow_deploy_key"
          chmod 600 "$HOME/.ssh/flow_deploy_key"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_args=(-i "$HOME/.ssh/flow_deploy_key" -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          target="$SERVER_USER@$SERVER_HOST"
          stage=$(ssh "${ssh_args[@]}" "$target" 'mktemp -d /tmp/chain-flow-monitor.XXXXXXXX')
          [[ "$stage" =~ ^/tmp/chain-flow-monitor\.[A-Za-z0-9]+$ ]]
          tar -C chain-flow-monitor -czf - monitor.py test_monitor.py deploy.sh chain-flow-monitor.service README.md |
            ssh "${ssh_args[@]}" "$target" "tar -xzf - -C '$stage'"
          ssh "${ssh_args[@]}" "$target" "sudo bash '$stage/deploy.sh' '$stage' '$RELEASE_SHA'"
          ssh "${ssh_args[@]}" "$target" "sudo rm -rf -- '$stage'"
