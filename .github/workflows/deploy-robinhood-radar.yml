name: Deploy Robinhood Chain Radar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-robinhood-radar.yml"
  workflow_dispatch:

concurrency:
  group: deploy-robinhood-radar-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out protected canonical HyperEVM snapshot
        uses: actions/checkout@v4
        with:
          ref: 1414b35c86e09a7073f4bd5e17f564f29191706f
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check aiohttp requests web3

      - name: Verify protected source before cloning
        working-directory: hyperevm-radar
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m compileall -q .
          grep -q 'CHAIN_ID = 999' config.py
          grep -q 'https://rpc.hyperliquid.xyz/evm' config.py

      - name: Build isolated 1-to-1 Robinhood clone
        run: |
          rm -rf /tmp/robinhood-radar
          cp -a hyperevm-radar /tmp/robinhood-radar
          rm -rf /tmp/robinhood-radar/data /tmp/robinhood-radar/.venv /tmp/robinhood-radar/__pycache__
          find /tmp/robinhood-radar -name '*.pyc' -delete
          python3 - <<'PY'
          from pathlib import Path
          import ast, io, tokenize

          root = Path('/tmp/robinhood-radar')
          cfg = root / 'config.py'
          s = cfg.read_text()
          s = s.replace('CHAIN_ID = 999', 'CHAIN_ID = 4663')
          s = s.replace('https://rpc.hyperliquid.xyz/evm', 'https://rpc.mainnet.chain.robinhood.com')
          cfg.write_text(s)

          # Chain-adapter-only startup guard. Keep canonical HyperEVM source untouched.
          main = root / 'main.py'
          s = main.read_text()
          old = 'if chain_id != 999:'
          new = 'if chain_id != 4663:'
          if old not in s:
              raise RuntimeError('Expected HyperEVM chain-id guard not found in protected snapshot')
          main.write_text(s.replace(old, new, 1))

          exact = [
              ('https://hyperevmscan.io/address/', 'https://robinhoodchain.blockscout.com/address/'),
              ('https://rpc.hyperliquid.xyz/evm', 'https://rpc.mainnet.chain.robinhood.com'),
              ('chainid=999', 'chainid=4663'),
              ('chainId=999', 'chainId=4663'),
              ('chain-999', 'chain-4663'),
              ('HYPEREVM_SEARCH_API_URL', 'ROBINHOOD_SEARCH_API_URL'),
              ('HYPEREVM_SEARCH_API_KEY', 'ROBINHOOD_SEARCH_API_KEY'),
          ]
          generic = [
              ('HyperEVM', 'Robinhood Chain'),
              ('Hyperliquid', 'Robinhood Chain'),
              ('hyperevm', 'robinhood'),
              ('hyperliquid', 'robinhood'),
          ]

          for p in root.rglob('*.py'):
              src = p.read_text()
              toks = []
              changed = False
              for tok in tokenize.generate_tokens(io.StringIO(src).readline):
                  if tok.type == tokenize.STRING:
                      try:
                          val = ast.literal_eval(tok.string)
                      except Exception:
                          toks.append(tok); continue
                      if isinstance(val, str):
                          new = val
                          for a, b in exact + generic:
                              new = new.replace(a, b)
                          if new != val:
                              tok = tokenize.TokenInfo(tok.type, repr(new), tok.start, tok.end, tok.line)
                              changed = True
                  toks.append(tok)
              if changed:
                  p.write_text(tokenize.untokenize(toks))

          for p in [root/'.env.example', root/'README.md']:
              if not p.exists():
                  continue
              text = p.read_text()
              for a, b in exact + generic:
                  text = text.replace(a, b)
              p.write_text(text)

          (root/'addresses.json').write_text('{\n  "deployers": []\n}\n')

          p = root/'platform_identity_candidates.py'
          text = p.read_text()
          start = text.find('ECOSYSTEM_SOURCES = [')
          end = text.find('\n\n\nclass EcosystemPageParser', start)
          if start >= 0 and end > start:
              block = '''ECOSYSTEM_SOURCES = [\n    (\n        "ROBINHOOD_CHAIN_OFFICIAL",\n        "https://docs.robinhood.com/chain/",\n    ),\n]\n'''
              text = text[:start] + block + text[end:]
              p.write_text(text)

          # Robinhood-only chain adapter: keep protected monitor logic intact,
          # then extend only the generated clone with internal CREATE/CREATE2 tracing.
          blocks = root/'monitors'/'blocks.py'
          with blocks.open('a') as f:
              f.write(r'''
          # --- Robinhood Chain deployment adapter: internal CREATE/CREATE2 discovery ---
          _RH_ORIGINAL_GET_CONTRACT_CREATIONS = HyperEVMBlockMonitor.get_contract_creations

          async def _rh_trace_internal_creations(self, block_number: int):
              block_hex = hex(int(block_number))
              found = []

              def add(address, creator, tx_hash=''):
                  if not address:
                      return
                  address = str(address)
                  if not address.startswith('0x') or len(address) != 42:
                      return
                  found.append({
                      'address': address,
                      'creator': str(creator or ''),
                      'block_number': int(block_number),
                      'tx_hash': str(tx_hash or ''),
                  })

              def walk_call(node, tx_hash=''):
                  if not isinstance(node, dict):
                      return
                  call_type = str(node.get('type') or '').upper()
                  if call_type in ('CREATE', 'CREATE2'):
                      add(node.get('to'), node.get('from'), tx_hash)
                  for child in node.get('calls') or []:
                      walk_call(child, tx_hash)

              try:
                  resp = await self.w3.provider.make_request(
                      'debug_traceBlockByNumber',
                      [block_hex, {'tracer': 'callTracer', 'timeout': '5s'}],
                  )
                  result = resp.get('result') if isinstance(resp, dict) else None
                  if isinstance(result, list):
                      for item in result:
                          if not isinstance(item, dict):
                              continue
                          tx_hash = item.get('txHash') or item.get('transactionHash') or ''
                          root = item.get('result') if isinstance(item.get('result'), dict) else item
                          walk_call(root, tx_hash)
                      if found:
                          print(f'Robinhood internal trace method=debug_traceBlockByNumber block={block_number} creates={len(found)}')
                          return found
              except Exception as e:
                  print(f'Robinhood debug trace unavailable block={block_number}: {type(e).__name__}: {e}')

              for method in ('arbtrace_block', 'trace_block'):
                  try:
                      resp = await self.w3.provider.make_request(method, [block_hex])
                      result = resp.get('result') if isinstance(resp, dict) else None
                      if not isinstance(result, list):
                          continue
                      local = []
                      for item in result:
                          if not isinstance(item, dict):
                              continue
                          if str(item.get('type') or '').lower() != 'create':
                              continue
                          action = item.get('action') or {}
                          output = item.get('result') or {}
                          address = output.get('address')
                          if address:
                              local.append({
                                  'address': address,
                                  'creator': action.get('from') or '',
                                  'block_number': int(block_number),
                                  'tx_hash': item.get('transactionHash') or '',
                              })
                      if local:
                          print(f'Robinhood internal trace method={method} block={block_number} creates={len(local)}')
                          return local
                  except Exception as e:
                      print(f'Robinhood {method} unavailable block={block_number}: {type(e).__name__}: {e}')

              return []

          async def _rh_get_contract_creations(self, block_number: int):
              events = await _RH_ORIGINAL_GET_CONTRACT_CREATIONS(self, block_number)
              seen_addresses = {str(e.get('address') or '').lower() for e in events}

              for event in await _rh_trace_internal_creations(self, block_number):
                  address = str(event.get('address') or '')
                  if not address or address.lower() in seen_addresses:
                      continue
                  try:
                      code = await self.get_code(address)
                      if not code:
                          continue
                  except Exception:
                      continue

                  creator = str(event.get('creator') or '')
                  tx_hash = str(event.get('tx_hash') or '')
                  save_token_creator(address, creator, block_number, tx_hash)
                  events.append({
                      'address': address,
                      'creator': creator,
                      'block_number': int(block_number),
                      'tx_hash': tx_hash,
                  })
                  seen_addresses.add(address.lower())
                  print(f'Robinhood internal contract detected address={address} creator={creator} block={block_number}')

              return events

          HyperEVMBlockMonitor.get_contract_creations = _rh_get_contract_creations
          ''')
          PY

          grep -q 'CHAIN_ID = 4663' /tmp/robinhood-radar/config.py
          grep -q 'https://rpc.mainnet.chain.robinhood.com' /tmp/robinhood-radar/config.py
          grep -q 'if chain_id != 4663:' /tmp/robinhood-radar/main.py
          grep -q 'derive_core_words' /tmp/robinhood-radar/platform_family_intelligence.py
          grep -q 'Robinhood internal contract detected' /tmp/robinhood-radar/monitors/blocks.py
          cd /tmp/robinhood-radar
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m compileall -q .

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Preflight server and Robinhood RPC without touching HyperEVM
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            echo "=== SERVER CAPACITY ==="
            nproc
            free -h
            df -h /opt
            echo "=== PROTECTED HYPEREVM READ-ONLY STATE ==="
            systemctl is-active hyperevm-radar.service 2>/dev/null || true
            systemctl is-enabled hyperevm-radar.service 2>/dev/null || true
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null || true
            echo "=== ROBINHOOD RPC ==="
            body=$(curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 \
              -A "Mozilla/5.0 RobinhoodRadar/1.0" \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}" \
              https://rpc.mainnet.chain.robinhood.com)
            printf "%s\n" "$body"
            python3 - "$body" <<"PY"
          import json, sys
          data=json.loads(sys.argv[1])
          assert int(data["result"],16)==4663, data
          print("chain_id=4663 OK")
          PY
          '

      - name: Deploy isolated Robinhood Radar
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" 'sudo mkdir -p /opt/robinhood-radar && sudo chown -R "$USER":"$(id -gn)" /opt/robinhood-radar'
          rsync -az --delete \
            --exclude='.venv/' --exclude='data/' --exclude='radar.db*' --exclude='__pycache__/' --exclude='*.pyc' \
            -e "$SSH" /tmp/robinhood-radar/ "$SERVER_USER@$SERVER_HOST:/opt/robinhood-radar/"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            cd /opt/robinhood-radar
            python3 -m venv .venv
            .venv/bin/python -m pip install --disable-pip-version-check -q aiohttp requests web3
            if [ -f /opt/hyperevm-radar/.env ]; then
              cp /opt/hyperevm-radar/.env /opt/robinhood-radar/.env
              sed -i "s/HYPEREVM_SEARCH_API_URL/ROBINHOOD_SEARCH_API_URL/g; s/HYPEREVM_SEARCH_API_KEY/ROBINHOOD_SEARCH_API_KEY/g" /opt/robinhood-radar/.env
            fi
            cat > /tmp/robinhood-radar.service <<"UNIT"
          [Unit]
          Description=Robinhood Chain Radar
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/robinhood-radar
          EnvironmentFile=-/opt/robinhood-radar/.env
          Environment=PYTHONUNBUFFERED=1
          ExecStart=/opt/robinhood-radar/.venv/bin/python /opt/robinhood-radar/main.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT
            sudo install -m 644 /tmp/robinhood-radar.service /etc/systemd/system/robinhood-radar.service
            sudo systemctl daemon-reload
            sudo systemctl enable robinhood-radar.service
            sudo systemctl restart robinhood-radar.service
          '

      - name: Verify Robinhood live and HyperEVM untouched
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            for i in $(seq 1 12); do
              systemctl is-active --quiet robinhood-radar.service && break
              sleep 3
            done
            test "$(systemctl is-active robinhood-radar.service)" = active
            test "$(systemctl is-enabled robinhood-radar.service)" = enabled
            sleep 8
            echo "=== ROBINHOOD SERVICE ==="
            systemctl show robinhood-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager
            journalctl -u robinhood-radar.service -n 100 --no-pager | tail -100
            journalctl -u robinhood-radar.service --since "2 minutes ago" --no-pager | grep -F "monitor started chain_id=4663" | tail -1
            test -s /opt/robinhood-radar/data/radar.db

            echo "=== WAIT FOR REAL ROBINHOOD DATABASE WRITE ==="
            found=0
            for i in $(seq 1 30); do
              result=$(python3 - <<"PY"
          import sqlite3
          p="/opt/robinhood-radar/data/radar.db"
          con=sqlite3.connect(p)
          tables={r[0] for r in con.execute("select name from sqlite_master")}
          if "contracts" not in tables:
              print("0||")
          else:
              n=con.execute("select count(*) from contracts").fetchone()[0]
              max_block=con.execute("select max(block_number) from contracts").fetchone()[0]
              latest=con.execute("select address, block_number from contracts order by block_number desc limit 1").fetchone()
              if latest:
                  print(f"{n}|{max_block}|{latest[0]}")
              else:
                  print("{}|{}|".format(n, max_block if max_block is not None else ""))
          con.close()
          PY
              )
              count=$(printf "%s" "$result" | cut -d"|" -f1)
              max_block=$(printf "%s" "$result" | cut -d"|" -f2)
              latest_address=$(printf "%s" "$result" | cut -d"|" -f3)
              echo "attempt=$i contracts=$count max_block=$max_block latest_address=$latest_address"
              if [ "${count:-0}" -gt 0 ]; then
                found=1
                break
              fi
              test "$(systemctl is-active robinhood-radar.service)" = active
              sleep 10
            done
            if [ "$found" != "1" ]; then
              echo "=== ROBINHOOD TRACE DIAGNOSTICS ==="
              journalctl -u robinhood-radar.service --since "10 minutes ago" --no-pager | grep -E "Robinhood (internal trace|debug trace|arbtrace_block|trace_block|internal contract)" | tail -80 || true
              exit 1
            fi
            echo "robinhood_db=OK contracts=$count max_block=$max_block latest_address=$latest_address"

            r1=$(systemctl show robinhood-radar.service -p NRestarts --value)
            p1=$(systemctl show robinhood-radar.service -p MainPID --value)
            test "$p1" != "0"
            sleep 5
            r2=$(systemctl show robinhood-radar.service -p NRestarts --value)
            p2=$(systemctl show robinhood-radar.service -p MainPID --value)
            test "$p2" != "0"
            test "$r1" = "$r2"
            echo "robinhood_stability=OK pid=$p2 restarts=$r2"
            echo "=== HYPEREVM READ-ONLY CHECK ==="
            test "$(systemctl is-active hyperevm-radar.service)" = active
            test "$(systemctl is-enabled hyperevm-radar.service)" = enabled
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager
          '
