name: 彻底停用并删除钱包雷达运行代码

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-wallet-radar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 删除 Wallet Radar 运行代码并永久禁用服务
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            test "$(systemctl is-active hyperevm-radar.service)" = active
            test "$(systemctl is-active robinhood-radar.service)" = active

            sudo systemctl disable --now wallet-radar-bot.service 2>/dev/null || true

            pids=$(pgrep -f "^/opt/wallet-radar/.venv/bin/python /opt/wallet-radar/(main|main_fast|telegram_console|telegram_bot)\.py( |$)" || true)
            if [ -n "$pids" ]; then kill $pids || true; sleep 2; fi

            sudo rm -f /opt/wallet-radar/main.py
            sudo rm -f /opt/wallet-radar/main_fast.py
            sudo rm -f /opt/wallet-radar/telegram_bot.py
            sudo rm -f /opt/wallet-radar/telegram_console.py
            sudo rm -f /opt/wallet-radar/test_fast_equivalence.py
            sudo rm -f /opt/wallet-radar/requirements.txt
            sudo rm -f /opt/wallet-radar/labels.json
            sudo rm -f /opt/wallet-radar/README.md
            sudo rm -f /opt/wallet-radar/.env
            sudo rm -f /opt/wallet-radar/.env.example

            sudo rm -f /etc/systemd/system/wallet-radar-bot.service
            sudo rm -f /etc/systemd/system/multi-user.target.wants/wallet-radar-bot.service
            sudo systemctl daemon-reload
            sudo systemctl mask wallet-radar-bot.service >/dev/null

            test ! -e /opt/wallet-radar/main.py
            test ! -e /opt/wallet-radar/main_fast.py
            test ! -e /opt/wallet-radar/telegram_bot.py
            test ! -e /opt/wallet-radar/telegram_console.py
            test "$(systemctl is-enabled wallet-radar-bot.service 2>/dev/null || true)" = masked
            test "$(systemctl is-active wallet-radar-bot.service 2>/dev/null || true)" != active
            if pgrep -af "/opt/wallet-radar/.*\.py"; then exit 1; fi

            test "$(systemctl is-active hyperevm-radar.service)" = active
            test "$(systemctl is-active robinhood-radar.service)" = active
            echo "WALLET_RADAR_RUNTIME_CODE_REMOVED"
            echo "WALLET_RADAR_SERVICE_MASKED"
            echo "HYPEREVM_ACTIVE"
            echo "ROBINHOOD_ACTIVE"
          '
