name: Diagnose Robinhood Contract Discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-robinhood-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Diagnose Robinhood discovery sources read-only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" 'python3 - <<"PY"
          import json, urllib.request, urllib.error
          RPC="https://rpc.mainnet.chain.robinhood.com"
          SCOUT="https://robinhoodchain.blockscout.com"
          UA="Mozilla/5.0 RobinhoodRadar-Diagnostic/1.0"

          def rpc(method, params, timeout=8):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(RPC,data=body,headers={"Content-Type":"application/json","User-Agent":UA})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: return json.loads(raw)
                  except Exception: return {"http_error":e.code,"body":raw[:1000]}
              except Exception as e:
                  return {"transport_error":repr(e)}

          def get(url, timeout=8):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,r.read().decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode(errors="replace")
              except Exception as e:
                  return 0,repr(e)

          cid=rpc("eth_chainId",[])
          latest_resp=rpc("eth_blockNumber",[])
          print("CHAIN",json.dumps(cid)[:500])
          print("LATEST",json.dumps(latest_resp)[:500])
          latest=int(latest_resp.get("result","0x0"),16)
          block_hex=hex(latest)
          print("BLOCK",latest,block_hex)

          for method,params in [
              ("debug_traceBlockByNumber",[block_hex,{"tracer":"callTracer","timeout":"3s"}]),
              ("arbtrace_block",[block_hex]),
              ("trace_block",[block_hex]),
          ]:
              out=rpc(method,params)
              result=out.get("result")
              summary={"error":out.get("error"),"transport_error":out.get("transport_error"),"http_error":out.get("http_error")}
              if isinstance(result,list):
                  summary.update(result_type="list",result_len=len(result),sample=result[:1])
              elif result is not None:
                  summary.update(result_type=type(result).__name__,sample=result)
              print("TRACE",method,json.dumps(summary,default=str)[:3000])

          top_level=[]; tx_total=0
          blocks=list(range(max(0,latest-4),latest+1))
          for n in blocks:
              b=rpc("eth_getBlockByNumber",[hex(n),True])
              obj=b.get("result") or {}; txs=obj.get("transactions") or []
              tx_total += len(txs)
              for tx in txs:
                  if tx.get("to") is None:
                      top_level.append((n,tx.get("hash"),tx.get("from")))
          print("TOP_LEVEL_SCAN blocks=%d txs=%d creations=%d sample=%s" % (len(blocks),tx_total,len(top_level),top_level[:5]))

          for url in [
              f"{SCOUT}/api/v2/blocks/{latest}",
              f"{SCOUT}/api/v2/blocks/{latest}/transactions",
              f"{SCOUT}/api/v2/main-page/blocks",
          ]:
              status,raw=get(url)
              print("SCOUT",status,url,raw[:3000].replace("\n"," "))
          PY'