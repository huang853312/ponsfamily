name: Repair GitBook Identity Guard Both Chains

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-gitbook-identity-both-chains.yml"
  workflow_dispatch:

concurrency:
  group: repair-gitbook-identity-both-chains
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-test-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check aiohttp requests web3

      - name: Apply narrow GitBook identity guard to HyperEVM source
        run: |
          python3 hyperevm-radar/tools/apply_gitbook_identity_guard.py hyperevm-radar/platform_family_intelligence.py
          grep -q 'SHARED_IDENTITY_HOSTS={"gitbook.com","gitbook.io"}' hyperevm-radar/platform_family_intelligence.py
          grep -q 'REJECTED_SHARED_PROVIDER_X' hyperevm-radar/platform_family_intelligence.py
          grep -q 'REJECTED_SHARED_IDENTITY_HOST' hyperevm-radar/platform_family_intelligence.py

      - name: Test canonical HyperEVM logic plus regression guard
        working-directory: hyperevm-radar
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m compileall -q .
          python3 - <<'PY'
          from platform_family_intelligence import derive_core_words
          assert derive_core_words('tumble') == ['tum','tumb','tumbl']
          print('canonical_3_4_5=OK')
          PY

      - name: Persist HyperEVM source fix
        run: |
          if git diff --quiet -- hyperevm-radar/platform_family_intelligence.py; then
            echo "Source already contains guard"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hyperevm-radar/platform_family_intelligence.py
            git commit -m "Block GitBook provider identity false positives"
            git push origin HEAD:main
          fi

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Stage repair files on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          SCP="scp -i $HOME/.ssh/deploy_key -P $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new"
          $SCP hyperevm-radar/platform_family_intelligence.py "$SERVER_USER@$SERVER_HOST:/tmp/platform_family_intelligence.hyper.fixed.py"
          $SCP hyperevm-radar/tools/apply_gitbook_identity_guard.py "$SERVER_USER@$SERVER_HOST:/tmp/apply_gitbook_identity_guard.py"
          $SCP hyperevm-radar/tests/test_gitbook_identity_guard.py "$SERVER_USER@$SERVER_HOST:/tmp/test_gitbook_identity_guard.py"
          $SSH "$SERVER_USER@$SERVER_HOST" 'chmod 700 /tmp/apply_gitbook_identity_guard.py'

      - name: Repair both chains atomically and restart
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            H=/opt/hyperevm-radar/platform_family_intelligence.py
            R=/opt/robinhood-radar/platform_family_intelligence.py
            test -f "$H"
            test -f "$R"
            cp "$H" /tmp/platform_family_intelligence.hyper.before-gitbook-fix.py
            cp "$R" /tmp/platform_family_intelligence.robin.before-gitbook-fix.py
            rollback() {
              echo "repair_failed: rolling back both files"
              cp /tmp/platform_family_intelligence.hyper.before-gitbook-fix.py "$H" || true
              cp /tmp/platform_family_intelligence.robin.before-gitbook-fix.py "$R" || true
              sudo systemctl restart hyperevm-radar.service || true
              sudo systemctl restart robinhood-radar.service || true
            }
            trap rollback ERR

            cp /tmp/platform_family_intelligence.hyper.fixed.py "$H"
            python3 /tmp/apply_gitbook_identity_guard.py "$R"

            grep -q "SHARED_IDENTITY_HOSTS" "$H"
            grep -q "SHARED_IDENTITY_HOSTS" "$R"
            grep -q "REJECTED_SHARED_PROVIDER_X" "$H"
            grep -q "REJECTED_SHARED_PROVIDER_X" "$R"

            cd /opt/hyperevm-radar
            .venv/bin/python -m compileall -q .
            PYTHONPATH=. .venv/bin/python /tmp/test_gitbook_identity_guard.py
            PYTHONPATH=. .venv/bin/python - <<"PY"
          from platform_family_intelligence import derive_core_words
          assert derive_core_words("tumble") == ["tum","tumb","tumbl"]
          print("hyperevm_3_4_5=OK")
          PY

            cd /opt/robinhood-radar
            .venv/bin/python -m compileall -q .
            PYTHONPATH=. .venv/bin/python /tmp/test_gitbook_identity_guard.py
            PYTHONPATH=. .venv/bin/python - <<"PY"
          from platform_family_intelligence import derive_core_words
          assert derive_core_words("tumble") == ["tum","tumb","tumbl"]
          print("robinhood_3_4_5=OK")
          PY

            sudo systemctl restart hyperevm-radar.service
            sudo systemctl restart robinhood-radar.service
            sleep 10
            test "$(systemctl is-active hyperevm-radar.service)" = active
            test "$(systemctl is-active robinhood-radar.service)" = active
            test "$(systemctl is-enabled hyperevm-radar.service)" = enabled
            test "$(systemctl is-enabled robinhood-radar.service)" = enabled
            trap - ERR
          '

      - name: Verify both radars healthy and guard live
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            echo "=== HYPEREVM ==="
            systemctl show hyperevm-radar.service -p ActiveState -p MainPID -p NRestarts --no-pager
            grep -n "SHARED_IDENTITY_HOSTS\|REJECTED_SHARED_PROVIDER_X\|REJECTED_SHARED_IDENTITY_HOST" /opt/hyperevm-radar/platform_family_intelligence.py | head -20
            journalctl -u hyperevm-radar.service --since "3 minutes ago" --no-pager | tail -80
            echo "=== ROBINHOOD ==="
            systemctl show robinhood-radar.service -p ActiveState -p MainPID -p NRestarts --no-pager
            grep -n "SHARED_IDENTITY_HOSTS\|REJECTED_SHARED_PROVIDER_X\|REJECTED_SHARED_IDENTITY_HOST" /opt/robinhood-radar/platform_family_intelligence.py | head -20
            journalctl -u robinhood-radar.service --since "3 minutes ago" --no-pager | tail -80
          '
