name: Deploy HyperEVM Radar
# Deployment trigger: identity and early-token discovery upgrade

on:
  push:
    branches:
      - main
    paths:
      - "hyperevm-radar/**"
      - ".github/workflows/deploy-hyperevm-radar.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hyperevm-radar-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check aiohttp requests web3

      - name: Apply GitBook identity false-positive guard
        run: |
          python3 hyperevm-radar/tools/apply_gitbook_identity_guard.py hyperevm-radar/platform_family_intelligence.py
          grep -q SHARED_IDENTITY_HOSTS hyperevm-radar/platform_family_intelligence.py
          grep -q REJECTED_SHARED_PROVIDER_X hyperevm-radar/platform_family_intelligence.py

      - name: Test HyperEVM Radar
        working-directory: hyperevm-radar
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m compileall -q .
          PYTHONPATH=. python3 - <<'PY'
          from platform_family_intelligence import derive_core_words, extract_core_word
          assert derive_core_words('tumble') == ['tum','tumb','tumbl']
          assert extract_core_word('https://www.gitbook.com/') == ''
          PY

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up and deploy HyperEVM Radar
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          $SSH "$SERVER_USER@$SERVER_HOST" \
            'sudo test -d /opt/hyperevm-radar && sudo cp -a /opt/hyperevm-radar "/opt/hyperevm-radar.backup.$(date -u +%Y%m%dT%H%M%SZ)"'

          rsync -az --delete \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='data/' \
            --exclude='radar.db*' \
            --exclude='addresses.json' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "$SSH" \
            --rsync-path='sudo rsync' \
            hyperevm-radar/ \
            "$SERVER_USER@$SERVER_HOST:/opt/hyperevm-radar/"

      - name: Restart and verify HyperEVM Radar
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" '
            set -e
            # Logging-only runtime setting: force Python stdout/stderr to reach
            # journald immediately. This does not change Radar discovery logic.
            sudo mkdir -p /etc/systemd/system/hyperevm-radar.service.d
            printf "%s\n" "[Service]" "Environment=PYTHONUNBUFFERED=1" | \
              sudo tee /etc/systemd/system/hyperevm-radar.service.d/10-unbuffered-logs.conf >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl restart hyperevm-radar.service

            service_active=false
            for attempt in $(seq 1 10); do
              if sudo systemctl is-active --quiet hyperevm-radar.service; then
                service_active=true
                break
              fi
              sleep 3
            done

            sudo systemctl status hyperevm-radar.service --no-pager || true
            sudo systemctl show hyperevm-radar.service -p Environment --no-pager | grep -F "PYTHONUNBUFFERED=1"
            grep -q SHARED_IDENTITY_HOSTS /opt/hyperevm-radar/platform_family_intelligence.py
            sudo journalctl -u hyperevm-radar.service -n 40 --no-pager
            test "$service_active" = true
          '
