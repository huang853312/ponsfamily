name: Deploy Multi-Chain Event Monitor

on:
  push:
    branches:
      - feature/multi-chain-event-monitor
    paths:
      - 'multi-chain-event-monitor/**'
      - '.github/workflows/deploy-multi-chain-event-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-multi-chain-event-monitor
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-chain-event-monitor

      - name: Compile and test
        working-directory: multi-chain-event-monitor
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m compileall -q .
          python3 -m unittest discover -s tests -v
          bash -n deploy.sh

      - name: Deploy only the independent monitor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/multi_chain_deploy_key"
          chmod 600 "$HOME/.ssh/multi_chain_deploy_key"
          ssh_args=(-i "$HOME/.ssh/multi_chain_deploy_key" -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          target="$SERVER_USER@$SERVER_HOST"

          stage=$(ssh "${ssh_args[@]}" "$target" 'mktemp -d /tmp/multi-chain-event-monitor.XXXXXXXX')
          [[ "$stage" =~ ^/tmp/multi-chain-event-monitor\.[A-Za-z0-9]+$ ]]
          cleanup() {
            ssh "${ssh_args[@]}" "$target" "sudo rm -rf -- '$stage'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          tar -C multi-chain-event-monitor -czf - . |
            ssh "${ssh_args[@]}" "$target" "tar -xzf - -C '$stage'"
          ssh "${ssh_args[@]}" "$target" "sudo bash '$stage/deploy.sh' '$stage' '$RELEASE_SHA'"
