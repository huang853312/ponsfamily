name: Audit HyperEVM Block Completeness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-hyperevm-block-completeness.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Read-only server health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -e
          SERVICE=hyperevm-radar.service
          echo '=== SERVICE ==='
          sudo systemctl is-active "$SERVICE" || true
          sudo systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p NRestarts || true
          PID=$(sudo systemctl show "$SERVICE" -p MainPID --value 2>/dev/null)

          sudo /opt/hyperevm-radar/.venv/bin/python - <<'PY'
          import os,sys,ast,sqlite3,asyncio,json
          from pathlib import Path
          os.chdir('/opt/hyperevm-radar');sys.path.insert(0,os.getcwd())
          for fn in ['monitors/blocks.py','main.py']:
              source=Path(fn).read_text()
              if fn.startswith('monitors/'): print('PRODUCTION_MONITOR_SOURCE',source,flush=True)
              else:
                  for n in ast.walk(ast.parse(source)):
                      if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name in ['handle_contract','get_contract_creations_with_pools']:
                          print('PRODUCTION_FUNCTION',n.name,ast.get_source_segment(source,n),flush=True)
          c=sqlite3.connect('file:data/radar.db?mode=ro',uri=True);c.row_factory=sqlite3.Row
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table'")]
          print('TABLES',tables,flush=True)
          for t in ['token_creators','relations','contracts']:
              print('SCHEMA',t,[dict(r) for r in c.execute('pragma table_info('+t+')')],flush=True)
          from monitors.blocks import HyperEVMBlockMonitor
          import subprocess
          logs=subprocess.check_output(['journalctl','-u','hyperevm-radar.service','--since','48 hours ago','--no-pager'],text=True)
          for line in logs.splitlines():
              if any(x in line for x in ['monitor started','log error block=','contract error','factory token log error','Stopping hyperevm','Started hyperevm']):
                  print('HISTORICAL_SCAN_LOG',line,flush=True)
          for name in ['seen','save_contract','save_relation']:
              source=Path('database.py').read_text()
              node=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name==name)
              print('DATABASE_FUNCTION',ast.get_source_segment(source,node),flush=True)
          async def audit():
              m=HyperEVMBlockMonitor();assert await m.chain_id()==999
              async def rpc(call):
                  for attempt in range(6):
                      try:return await call()
                      except Exception:
                          if attempt==5:raise
                          await asyncio.sleep(min(8,2**attempt))
              from detectors.pools import detect_pool_event
              from unittest.mock import AsyncMock,Mock,patch
              import monitors.blocks as production
              test=HyperEVMBlockMonitor();test.w3=Mock()
              test.w3.eth.get_logs=AsyncMock(side_effect=RuntimeError('AUDIT_INJECTED_RATE_LIMIT'))
              print('FAULT_LOG_RETURN',await test.get_logs(1),flush=True)
              block=Mock();block.transactions=[{'from':'0x'+'a'*40,'to':None,'hash':b'1'*32}]
              test.w3.eth.get_block=AsyncMock(return_value=block)
              test.w3.eth.get_transaction_receipt=AsyncMock(side_effect=RuntimeError('AUDIT_INJECTED_RECEIPT_FAILURE'))
              with patch.object(production,'load_deployers',return_value={}):
                  print('FAULT_RECEIPT_RETURN',await test.get_contract_creations(1),flush=True)
              poolblocks=[r[0] for r in c.execute("select distinct block_number from contract_relations where relation_type in ('V2_PAIR','V3_POOL') order by block_number desc limit 12")]
              restarts=[]
              import re
              for line in logs.splitlines():
                  match=re.search(r'from_block=(\d+)',line)
                  if match:restarts.append(int(match.group(1)))
              selected=set(poolblocks)
              for n in restarts[-6:]:
                  selected.update(range(n-3,n+3))
              print('AUDIT_SELECTION',json.dumps({'pool_blocks':poolblocks,'restart_heads':restarts,'selected_blocks':sorted(selected)}),flush=True)
              missing=[];missingpools=[];deployments=0;pools=0
              for number in sorted(selected):
                  await asyncio.sleep(0.4)
                  block=await rpc(lambda:m.w3.eth.get_block(number,full_transactions=True))
                  for tx in block.transactions:
                      if tx.get('to') is not None:continue
                      receipt=await rpc(lambda:m.w3.eth.get_transaction_receipt(tx['hash']))
                      ca=receipt.get('contractAddress')
                      if not ca:continue
                      deployments+=1
                      creator=c.execute('select 1 from token_creators where lower(token_address)=?',(ca.lower(),)).fetchone()
                      contract=c.execute('select 1 from contracts where lower(address)=?',(ca.lower(),)).fetchone()
                      if not creator or not contract:missing.append({'block':number,'address':ca,'creator_record':bool(creator),'contract_record':bool(contract)})
                  events=await rpc(lambda:m.w3.eth.get_logs({'fromBlock':number,'toBlock':number}))
                  for event in events:
                      info=detect_pool_event(event)
                      if not info:continue
                      pools+=1
                      found=c.execute('select 1 from contract_relations where lower(parent_address)=? and lower(child_address)=? and relation_type=? and block_number=?',(info['factory'].lower(),info['pool'].lower(),info['type'],number)).fetchone()
                      if not found:missingpools.append({'block':number,**info})
              print('TARGETED_COMPLETENESS',json.dumps({'blocks':len(selected),'deployments':deployments,'missing_deployments':missing,'pools':pools,'missing_pools':missingpools}),flush=True)
          asyncio.run(audit())
          PY
          REMOTE

# Pool completeness check 1789350560968

