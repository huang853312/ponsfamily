name: Audit HyperEVM Block Completeness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-hyperevm-block-completeness.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Read-only server health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -e
          SERVICE=hyperevm-radar.service
          echo '=== SERVICE ==='
          sudo systemctl is-active "$SERVICE" || true
          sudo systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p NRestarts || true
          PID=$(sudo systemctl show "$SERVICE" -p MainPID --value 2>/dev/null)

          sudo /opt/hyperevm-radar/.venv/bin/python - <<'PY'
          import asyncio,json,os,re,sqlite3,subprocess,sys,time
          from pathlib import Path
          root=Path('/opt/hyperevm-radar');os.chdir(root);sys.path.insert(0,str(root))
          from monitors.blocks import HyperEVMBlockMonitor
          c=sqlite3.connect('file:'+str(root/'data/radar.db')+'?mode=ro',uri=True);c.row_factory=sqlite3.Row
          def snapshot():
              raw=subprocess.check_output(['systemctl','show','hyperevm-radar.service','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts'],text=True)
              health=dict(line.split('=',1) for line in raw.strip().splitlines())
              cursor=c.execute('SELECT next_block FROM radar_scan_progress WHERE chain_id=999').fetchone()[0]
              result={'at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'next_block':cursor,'service':health}
              print('LIVE_SCAN_SNAPSHOT',json.dumps(result),flush=True)
              assert health['ActiveState']=='active' and health['SubState']=='running' and health['NRestarts']=='0'
              return result
          async def probe():
              first=snapshot();monitor=HyperEVMBlockMonitor()
              for attempt in range(1,7):
                  try:
                      head=await monitor.latest_block();break
                  except Exception as exc:
                      print('AUDIT_RPC_RETRY',attempt,type(exc).__name__,flush=True)
                      if attempt==6:raise
                      await asyncio.sleep(min(8,2**attempt))
              print('LATEST_HEAD_AND_BACKLOG',json.dumps({'head':head,'next_block':c.execute('SELECT next_block FROM radar_scan_progress WHERE chain_id=999').fetchone()[0]}),flush=True)
              await asyncio.sleep(20)
              last=snapshot()
              assert last['next_block']>first['next_block'],'Scanner stopped again'
              for table,field in [('telegram_outbox','status'),('contract_processing','state'),('pool_observations','validation_status'),('platform_identity_investigations','verification_status')]:
                  print('CURRENT_COUNTS',table,json.dumps([list(r) for r in c.execute(f'SELECT {field},count(*) FROM {table} GROUP BY {field}')]),flush=True)
              row=c.execute("SELECT p.state,p.attempts,p.last_error,c.level,c.block_number FROM contract_processing p LEFT JOIN contracts c ON lower(c.address)=p.address WHERE p.address='0xba8b2199f72369d95660276a88fbe1eae8c5a278'").fetchone()
              assert row and row['state']=='completed'
              print('RECOVERED_EVENT',json.dumps(dict(row)),flush=True)
              log=subprocess.check_output(['journalctl','_PID='+last['service']['MainPID'],'--since','-10 min','-o','cat','--no-pager'],text=True)
              print('PROCESS_ERROR_COUNTS',json.dumps({'scan_retries':log.count('SCAN_RETRY'),'rate_limits':log.count('rate limited'),'invalid_opcode_errors':log.count('InvalidFEOpcode')}),flush=True)
              print('LIVE_SCAN_AUDIT_PASSED',flush=True)
          asyncio.run(probe())
          PY
          REMOTE

