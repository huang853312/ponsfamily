name: Audit HyperEVM Block Completeness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-hyperevm-block-completeness.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Read-only server health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -e
          SERVICE=hyperevm-radar.service
          echo '=== SERVICE ==='
          sudo systemctl is-active "$SERVICE" || true
          sudo systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p NRestarts || true
          PID=$(sudo systemctl show "$SERVICE" -p MainPID --value 2>/dev/null)

          sudo /opt/hyperevm-radar/.venv/bin/python - <<'PY'
          import asyncio,json,os,re,sqlite3,subprocess,sys,time
          from pathlib import Path
          root=Path('/opt/hyperevm-radar');os.chdir(root);sys.path.insert(0,str(root))
          print('AUDIT_NOW',time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),flush=True)
          print('SERVICE',subprocess.check_output(['systemctl','show','hyperevm-radar.service','-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts'],text=True).strip().replace('\n',';'),flush=True)
          c=sqlite3.connect('file:'+str(root/'data/radar.db')+'?mode=ro',uri=True);c.row_factory=sqlite3.Row
          cursor=c.execute('SELECT * FROM radar_scan_progress WHERE chain_id=999').fetchone()
          print('CURSOR',json.dumps(dict(cursor)),flush=True)
          pending=[dict(r) for r in c.execute("SELECT * FROM contract_processing WHERE state!='completed' ORDER BY updated_at DESC LIMIT 5")]
          print('PENDING_CONTRACTS',json.dumps(pending),flush=True)
          logs=subprocess.check_output(['journalctl','-u','hyperevm-radar.service','--since','-30 min','-o','cat','--no-pager'],text=True)
          lines=logs.splitlines()
          indexes=[i for i,l in enumerate(lines) if 'SCAN_RETRY' in l or 'contract error ' in l]
          selected=set()
          for i in indexes[-4:]:selected.update(range(max(0,i-24),min(len(lines),i+2)))
          safe=[re.sub(r'https?://[^\s\x27\x22]+','<redacted-url>',lines[i]) for i in sorted(selected)]
          print('SCAN_ERROR_TRACE',json.dumps(safe),flush=True)
          from monitors.blocks import HyperEVMBlockMonitor
          from detectors.token import detect_erc20
          async def probe():
              monitor=HyperEVMBlockMonitor()
              try:
                  head=await monitor.latest_block()
                  print('CHAIN_HEAD',head,'BACKLOG',max(0,head-cursor['next_block']+1),flush=True)
              except Exception as exc:print('HEAD_ERROR',type(exc).__name__,flush=True)
              for row in pending[:2]:
                  address=row['address']
                  for selector in ['0x18160ddd','0x313ce567','0x95d89b41','0x06fdde03']:
                      try:
                          result=await monitor.w3.eth.call({'to':monitor.w3.to_checksum_address(address),'data':selector})
                          print('RPC_METADATA_RESPONSE',json.dumps({'address':address,'selector':selector,'length':len(result)}),flush=True)
                      except Exception as exc:
                          detail=re.sub(r'https?://[^\s\x27\x22]+','<redacted-url>',str(exc))
                          print('RPC_METADATA_ERROR',json.dumps({'address':address,'selector':selector,'type':type(exc).__name__,'detail':detail[:700]}),flush=True)
          asyncio.run(probe())
          print('SCAN_STALL_AUDIT_COMPLETE',flush=True)
          PY
          REMOTE

