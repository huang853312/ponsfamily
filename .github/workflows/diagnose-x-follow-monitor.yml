name: Recover X Follow Monitor Config

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-x-follow-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Rebuild private config and test a real scan
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          XAPI_KEY: ${{ secrets.XAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$XAPI_KEY"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          { printf 'XAPI_KEY='; printf '%s' "$XAPI_KEY"; printf '\\n'; } | $SSH "$SERVER_USER@$SERVER_HOST" 'umask 077; cat > /tmp/x-follow-xapi.env'

          $SSH "$SERVER_USER@$SERVER_HOST" 'sudo python3 -' <<'PY'
          import hashlib
          import json
          import os
          import pwd
          import shutil
          import subprocess
          import tempfile
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib import parse, request, error

          root = Path("/home/ubuntu/ponsfamily/x-follow-monitor")
          env_path = root / ".env"
          state_path = root / "state.json"
          staged_path = Path("/tmp/x-follow-xapi.env")

          def api(token, method, payload=None):
              url = "https://api.telegram.org/bot" + token + "/" + method
              req = request.Request(url, data=parse.urlencode(payload or {}).encode(), method="POST")
              try:
                  with request.urlopen(req, timeout=15) as response:
                      return json.loads(response.read().decode())
              except error.HTTPError as exc:
                  try:
                      return json.loads(exc.read().decode())
                  except Exception:
                      return {}
              except Exception:
                  return {}

          if not state_path.is_file():
              raise SystemExit("recovery=stopped_state_missing")
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit("recovery=stopped_state_invalid")
          if not isinstance(state, dict):
              raise SystemExit("recovery=stopped_state_invalid")

          staged_text = staged_path.read_text(encoding="utf-8")
          staged_path.unlink(missing_ok=True)
          keys = []
          for row in staged_text.splitlines():
              if "=" in row and row.split("=", 1)[0].strip() == "XAPI_KEY":
                  keys.append(row.split("=", 1)[1].strip())
          if len(keys) != 1 or not keys[0] or chr(10) in keys[0] or chr(13) in keys[0]:
              raise SystemExit("recovery=stopped_invalid_key")
          new_key = keys[0]

          pid = subprocess.run(
              ["systemctl", "show", "x-follow-monitor.service", "-p", "MainPID", "--value"],
              capture_output=True, text=True, timeout=10
          ).stdout.strip()
          if not pid or pid == "0":
              raise SystemExit("recovery=stopped_live_process_missing")
          try:
              raw_env = Path("/proc/" + pid + "/environ").read_bytes()
          except OSError:
              raise SystemExit("recovery=stopped_live_environment_unreadable")
          live = {}
          for item in raw_env.split(bytes([0])):
              if b"=" in item:
                  k, v = item.split(b"=", 1)
                  live[k.decode(errors="ignore")] = v.decode(errors="ignore")
          token = live.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = live.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("recovery=stopped_telegram_config_missing")
          me = api(token, "getMe")
          username = str((me.get("result") or {}).get("username", "")).lower() if me.get("ok") else ""
          if username != "xfollow_monitor_alert_bot":
              raise SystemExit("recovery=stopped_wrong_bot")
          chat = api(token, "getChat", {"chat_id": chat_id})
          if not chat.get("ok"):
              raise SystemExit("recovery=stopped_chat_validation_failed")

          cfg = {}
          if env_path.is_file():
              for row in env_path.read_text(encoding="utf-8").splitlines():
                  row = row.strip()
                  if row and not row.startswith("#") and "=" in row:
                      k, v = row.split("=", 1)
                      cfg[k.strip()] = v.strip().strip(chr(34)).strip(chr(39))
          previous_key = cfg.get("XAPI_KEY", "")
          stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%S%fZ")
          if env_path.is_file():
              backup_env = root / (".env.before_recovery_" + stamp)
              shutil.copy2(env_path, backup_env)
              os.chmod(backup_env, 0o600)
          backup_state = root / ("state.json.before_recovery_" + stamp)
          shutil.copy2(state_path, backup_state)
          os.chmod(backup_state, 0o600)

          cfg["TELEGRAM_BOT_TOKEN"] = token
          cfg["TELEGRAM_CHAT_ID"] = chat_id
          cfg["XAPI_KEY"] = new_key
          state.pop("api_pause_until", None)
          state.pop("api_pause_reason", None)

          def atomic_write(path, body, mode, uid, gid):
              fd, tmp = tempfile.mkstemp(prefix=".recover.", dir=str(path.parent))
              try:
                  os.fchmod(fd, mode)
                  os.fchown(fd, uid, gid)
                  with os.fdopen(fd, "w", encoding="utf-8") as out:
                      out.write(body)
                      out.flush()
                      os.fsync(out.fileno())
                  os.replace(tmp, path)
              finally:
                  if os.path.exists(tmp):
                      os.unlink(tmp)

          owner = pwd.getpwnam("ubuntu")
          old_state_stat = state_path.stat()
          atomic_write(state_path, json.dumps(state, ensure_ascii=False, indent=2) + chr(10),
                       old_state_stat.st_mode & 0o777, old_state_stat.st_uid, old_state_stat.st_gid)
          env_body = "".join(k + "=" + v + chr(10) for k, v in cfg.items())
          atomic_write(env_path, env_body, 0o600, owner.pw_uid, owner.pw_gid)

          fp = lambda value: hashlib.sha256(value.encode()).hexdigest()[:12]
          print("config_recovery=restored")
          print("telegram_bot=@" + username)
          print("telegram_chat=validated")
          print("previous_xapi_fingerprint=" + (fp(previous_key) if previous_key else "none"))
          print("active_xapi_fingerprint=" + fp(new_key))
          print("accounts_preserved=" + str(len(state.get("accounts") or [])))
          print("billing_pause_cleared=true")
          sent = api(token, "sendMessage", {
              "chat_id": chat_id,
              "text": "X关注监控：专属配置已恢复，正在重新扫描。"
          })
          print("telegram_test_message=" + ("sent" if sent.get("ok") else "failed"))

          subprocess.run(["systemctl", "restart", "x-follow-monitor.service"], check=True)
          active = ""
          for attempt in range(15):
              active = subprocess.run(["systemctl", "is-active", "x-follow-monitor.service"],
                                      capture_output=True, text=True).stdout.strip()
              if active == "active":
                  break
              time.sleep(2)
          print("service=" + active)
          if active != "active":
              raise SystemExit("recovery=service_not_active")

          previous_scan = float(state.get("last_scan_at", 0) or 0)
          final_state = state
          deadline = time.time() + 110
          while time.time() < deadline:
              time.sleep(2)
              try:
                  latest = json.loads(state_path.read_text(encoding="utf-8"))
                  if isinstance(latest, dict):
                      final_state = latest
                      if float(latest.get("last_scan_at", 0) or 0) > previous_scan:
                          break
              except (OSError, json.JSONDecodeError):
                  pass
          print("last_scan_result=" + str(final_state.get("last_scan_result") or "none"))
          print("scan_ok_accounts=" + str(final_state.get("last_scan_ok_accounts", 0)))
          print("scan_failed_accounts=" + str(final_state.get("last_scan_failed_accounts", 0)))
          print("pending_notifications=" + str(len(final_state.get("pending_notifications") or [])))
          print("api_pause_reason=" + str(final_state.get("api_pause_reason") or "none"))
          print("scan_updated_after_restart=" + str(float(final_state.get("last_scan_at", 0) or 0) > previous_scan).lower())
          logs = subprocess.run(["journalctl", "-u", "x-follow-monitor.service", "--since", "3 minutes ago", "--no-pager"],
                                capture_output=True, text=True)
          for row in logs.stdout.splitlines():
              if any(tag in row for tag in ("SCAN_SUMMARY", "XAPI_BILLING_PAUSE", "NOTICE_SENT", "Traceback", "ERROR")):
                  print(row[-500:])
          PY
