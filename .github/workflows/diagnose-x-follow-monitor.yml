name: Diagnose X Follow Monitor Notifications

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-x-follow-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read monitor state and test Telegram delivery
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          XAPI_KEY: ${{ secrets.XAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$XAPI_KEY"
          saved_fp=$(printf '%s' "$XAPI_KEY" | sha256sum | cut -c1-12)
          echo "saved_secret_fingerprint=$saved_fp"
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -p "$SERVER_PORT" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          DIAG_B64=$(base64 -w0 <<'PY'
          import hashlib
          import json
          import time
          import subprocess
          from pathlib import Path
          from urllib import parse, request, error

          root = Path("/home/ubuntu/ponsfamily/x-follow-monitor")
          env_path = root / ".env"
          cfg = {}
          if env_path.is_file():
              for line in env_path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = line.strip()
                  if line and not line.startswith("#") and "=" in line:
                      k, v = line.split("=", 1)
                      cfg[k.strip()] = v.strip().strip('"').strip("'")
          else:
              print("monitor_env=missing")

          token, chat = cfg.get("TELEGRAM_BOT_TOKEN", ""), cfg.get("TELEGRAM_CHAT_ID", "")
          key = cfg.get("XAPI_KEY", "")
          state = {}
          try:
              state = json.loads((root / "state.json").read_text(encoding="utf-8"))
          except Exception as exc:
              print("state_read=failed:" + type(exc).__name__)

          print("xapi_key_present=" + str(bool(key)).lower())
          if key:
              print("xapi_key_fingerprint=" + hashlib.sha256(key.encode()).hexdigest()[:12])
          print("accounts_count=" + str(len(state.get("accounts") or [])))
          print("monitor_running=" + str(bool(state.get("running"))).lower())
          print("pending_notifications=" + str(len(state.get("pending_notifications") or [])))
          print("last_scan_result=" + str(state.get("last_scan_result") or "none"))
          last = float(state.get("last_scan_at", 0) or 0)
          print("last_scan_epoch=" + (str(int(last)) if last else "none"))
          print("scan_ok_accounts=" + str(state.get("last_scan_ok_accounts", 0)))
          print("scan_failed_accounts=" + str(state.get("last_scan_failed_accounts", 0)))
          print("api_pause_reason=" + str(state.get("api_pause_reason") or "none"))
          print("api_pause_active=" + str(float(state.get("api_pause_until", 0) or 0) > time.time()).lower())
          # Check the credentials the live process already has in memory (do not print values).
          try:
              pid = subprocess.run(
                  ["systemctl", "show", "x-follow-monitor.service", "-p", "MainPID", "--value"],
                  capture_output=True, text=True, timeout=10
              ).stdout.strip()
              runtime = {}
              for item in Path("/proc/" + pid + "/environ").read_bytes().split(bytes([0])):
                  if b"=" in item:
                      k, v = item.split(b"=", 1)
                      runtime[k.decode(errors="ignore")] = v.decode(errors="ignore")
              runtime_token = runtime.get("TELEGRAM_BOT_TOKEN", "")
              runtime_chat = runtime.get("TELEGRAM_CHAT_ID", "")
              print("runtime_telegram_token_present=" + str(bool(runtime_token)).lower())
              if runtime_token:
                  me_runtime, _err_runtime = call_for_token(runtime_token, "getMe") if "call_for_token" in globals() else ({}, None)
                  if not me_runtime:
                      runtime_url = "https://api.telegram.org/bot" + runtime_token + "/getMe"
                      runtime_req = request.Request(runtime_url, data=b"", method="POST")
                      try:
                          with request.urlopen(runtime_req, timeout=12) as response:
                              me_runtime = json.loads(response.read().decode())
                      except Exception:
                          me_runtime = {}
                  runtime_user = ((me_runtime.get("result") or {}).get("username", "") if me_runtime.get("ok") else "")
                  print("runtime_telegram_bot=@" + runtime_user if runtime_user else "runtime_telegram_get_me=failed")
                  print("runtime_telegram_token_fingerprint=" + hashlib.sha256(runtime_token.encode()).hexdigest()[:12])
                  if runtime_chat:
                      chat_url = "https://api.telegram.org/bot" + runtime_token + "/getChat"
                      chat_req = request.Request(chat_url, data=parse.urlencode({"chat_id": runtime_chat}).encode(), method="POST")
                      try:
                          with request.urlopen(chat_req, timeout=12) as response:
                              chat_result = json.loads(response.read().decode())
                      except Exception:
                          chat_result = {}
                      print("runtime_telegram_chat=" + ("ok" if chat_result.get("ok") else "failed"))
                      print("runtime_telegram_chat_fingerprint=" + hashlib.sha256(runtime_chat.encode()).hexdigest()[:10])
          except Exception as exc:
              print("runtime_telegram_env_check=failed:" + type(exc).__name__)

          # Only inspect legacy staging/backups belonging to this X follow monitor.
          legacy_paths = [Path("/tmp/x-follow-xapi.env"), Path("/var/tmp/x-follow-xapi.env")]
          try:
              legacy_paths.extend(p for p in root.glob(".env*") if p != (root / ".env") and p.is_file())
          except OSError:
              pass
          seen_paths, old_keys = set(), {}
          for path in legacy_paths:
              try:
                  resolved = path.resolve()
                  if resolved in seen_paths or not resolved.is_file() or resolved.stat().st_size > 100000:
                      continue
                  seen_paths.add(resolved)
                  values = []
                  for line in resolved.read_text(encoding="utf-8", errors="ignore").splitlines():
                      value_line = line.strip()
                      if value_line.startswith("XAPI_KEY="):
                          val = value_line.split("=", 1)[1].strip().strip(chr(34)).strip(chr(39))
                          if val:
                              values.append(val)
                  if len(values) == 1 and values[0] and values[0] != key:
                      old_keys.setdefault(values[0], []).append(path.name)
              except (OSError, RuntimeError):
                  pass
          print("distinct_legacy_key_candidates=" + str(len(old_keys)))
          for old_value, sources in old_keys.items():
              old_fp = hashlib.sha256(old_value.encode()).hexdigest()[:12]
              print("legacy_key_fingerprint=" + old_fp + " sources=" + ",".join(sorted(set(sources))))

          def call(method, payload=None):
              url = "https://api.telegram.org/bot" + token + "/" + method
              body = parse.urlencode(payload or {}).encode()
              req = request.Request(url, data=body, method="POST")
              try:
                  with request.urlopen(req, timeout=20) as response:
                      result = json.loads(response.read().decode())
                      return result, None
              except error.HTTPError as exc:
                  try:
                      result = json.loads(exc.read().decode())
                      return result, None
                  except Exception:
                      return {}, "http_" + str(exc.code)
              except Exception as exc:
                  return {}, type(exc).__name__

          # Search only backups belonging to this X monitor; never print credentials.
          backup_paths = list(root.glob(".env*")) + list(root.glob("*.env*"))
          backup_paths += [Path("/tmp/x-follow-monitor.env"), Path("/var/tmp/x-follow-monitor.env")]

          def call_for_token(candidate_token, method, payload=None):
              url = "https://api.telegram.org/bot" + candidate_token + "/" + method
              body = parse.urlencode(payload or {}).encode()
              req = request.Request(url, data=body, method="POST")
              try:
                  with request.urlopen(req, timeout=12) as response:
                      return json.loads(response.read().decode())
              except error.HTTPError as exc:
                  try:
                      return json.loads(exc.read().decode())
                  except Exception:
                      return {}
              except Exception:
                  return {}

          seen_backup_paths, seen_backup_tokens = set(), set()
          for backup_path in backup_paths:
              try:
                  resolved = backup_path.resolve()
                  if resolved in seen_backup_paths or not resolved.is_file() or resolved.stat().st_size > 100000:
                      continue
                  seen_backup_paths.add(resolved)
                  backup_text = resolved.read_text(encoding="utf-8", errors="ignore")
              except (OSError, RuntimeError):
                  continue
              backup_cfg = {}
              for backup_line in backup_text.splitlines():
                  line = backup_line.strip()
                  if line and not line.startswith("#") and "=" in line:
                      bk, bv = line.split("=", 1)
                      backup_cfg[bk.strip()] = bv.strip().strip(chr(34)).strip(chr(39))
              backup_token = backup_cfg.get("TELEGRAM_BOT_TOKEN", "")
              backup_chat = backup_cfg.get("TELEGRAM_CHAT_ID", "")
              if not backup_token or backup_token == token or backup_token in seen_backup_tokens:
                  continue
              seen_backup_tokens.add(backup_token)
              candidate = call_for_token(backup_token, "getMe")
              candidate_result = candidate.get("result") or {}
              candidate_user = candidate_result.get("username", "") if candidate.get("ok") else ""
              if candidate_user:
                  print("telegram_backup_candidate file=" + backup_path.name
                        + " bot=@" + candidate_user
                        + " token_fingerprint=" + hashlib.sha256(backup_token.encode()).hexdigest()[:12])
                  if backup_chat:
                      chat_result = call_for_token(backup_token, "getChat", {"chat_id": backup_chat})
                      print("telegram_backup_chat=" + ("ok" if chat_result.get("ok") else "failed")
                            + " chat_fingerprint=" + hashlib.sha256(backup_chat.encode()).hexdigest()[:10])

          if not token or not chat:
              print("telegram_config=missing")
          else:
              me, me_err = call("getMe")
              print("telegram_get_me=" + ("ok" if me.get("ok") else "failed:" + str(me_err or me.get("error_code") or "api_error")))
              if me.get("ok"):
                  print("telegram_bot_username=@" + str((me.get("result") or {}).get("username", "unknown")))
              ch, ch_err = call("getChat", {"chat_id": chat})
              print("telegram_target_chat=" + ("ok" if ch.get("ok") else "failed:" + str(ch_err or ch.get("error_code") or "api_error")))
              wh, wh_err = call("getWebhookInfo")
              print("telegram_webhook_enabled=" + str(bool(((wh.get("result") or {}).get("url")))).lower() if wh.get("ok") else "telegram_webhook_check=failed:" + str(wh_err or wh.get("error_code") or "api_error"))
              print("telegram_send_test_skipped=true")

          PY
          )
          "${SSH[@]}" "$SERVER_USER@$SERVER_HOST" "
            set -eu
            printf 'service_active='
            sudo systemctl is-active x-follow-monitor.service || true
            sudo systemctl show x-follow-monitor.service -p MainPID -p Result -p NRestarts --no-pager
            echo '$DIAG_B64' | base64 -d | sudo python3
            echo '--- recent service events ---'
            sudo journalctl -u x-follow-monitor.service --since '90 minutes ago' --no-pager |
              grep -E 'COMMAND_RECEIVED|SCAN_SUMMARY|XAPI_BILLING_PAUSE|XAPI_RESPONSE_DIAGNOSTIC|Telegram|notification|ERROR|Traceback' |
              tail -n 80 || true
          "
