name: Diagnose X Follow Monitor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-x-follow-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose Telegram command path
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          DIAG_B64=$(base64 -w0 <<'PY'
          import json
          from pathlib import Path
          from urllib import parse, request

          target = Path("/home/ubuntu/ponsfamily/x-follow-monitor")
          env = {}
          for line in (target / ".env").read_text().splitlines():
              if line and not line.lstrip().startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  env[key.strip()] = value.strip().strip(chr(34))
          state = json.loads((target / "state.json").read_text())
          token = env["TELEGRAM_BOT_TOKEN"]
          base = "https://api.telegram.org/bot" + token

          def call(method, payload=None):
              data = parse.urlencode(payload or {}).encode()
              req = request.Request(base + "/" + method, data=data, method="POST")
              with request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          me = call("getMe").get("result") or {}
          webhook = call("getWebhookInfo").get("result") or {}
          configured_chat = str(env.get("TELEGRAM_CHAT_ID", ""))
          chat = call("getChat", {"chat_id": configured_chat}).get("result") or {}
          masked_chat = ("*" * max(0, len(configured_chat) - 4)) + configured_chat[-4:]
          print("bot_username=@" + str(me.get("username", "unknown")))
          print("configured_chat=" + masked_chat)
          print("configured_chat_type=" + str(chat.get("type", "unknown")))
          print("configured_chat_title=" + str(chat.get("title") or chat.get("username") or chat.get("first_name") or "unknown"))
          print("webhook_enabled=" + str(bool(webhook.get("url"))).lower())
          print("webhook_pending=" + str(webhook.get("pending_update_count", 0)))
          print("state_offset=" + str(state.get("offset", 0)))
          print("state_accounts=" + str(len(state.get("accounts") or [])))
          print("monitored_accounts=" + ",".join(state.get("accounts") or []))
          print("state_running=" + str(bool(state.get("running"))).lower())
          print("state_mtime=" + str(int((target / "state.json").stat().st_mtime)))
          PY
          )

          $SSH "$SERVER_USER@$SERVER_HOST" "
            set -eu
            echo service_state=\$(sudo systemctl is-active x-follow-monitor.service)
            sudo systemctl show x-follow-monitor.service -p MainPID -p NRestarts -p Result -p ExecMainStatus -p ActiveEnterTimestamp --no-pager
            echo processes:
            pgrep -af /home/ubuntu/ponsfamily/x-follow-monitor/app.py || true
            echo '$DIAG_B64' | base64 -d | sudo python3
            echo recent_logs:
            sudo journalctl -u x-follow-monitor.service --since '20 minutes ago' --no-pager
          "
