name: 安装独立多链钱包雷达

on:
  push:
    branches: [main]
    paths:
      - "wallet-radar/**"
      - ".github/workflows/deploy-wallet-radar.yml"
  workflow_dispatch:

concurrency:
  group: deploy-wallet-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 本地语法和隔离检查
        run: |
          set -eu
          python3 -m py_compile wallet-radar/main.py
          test -f wallet-radar/requirements.txt
          test -f wallet-radar/.env.example
          test -f wallet-radar/labels.json
          if grep -nE '(/opt/hyperevm-radar|hyperevm-radar\.service|import .*hyperevm-radar)' wallet-radar/main.py wallet-radar/.env.example wallet-radar/requirements.txt; then
            echo '发现对现有 HyperEVM Radar 的运行时依赖，拒绝安装。'
            exit 1
          fi
          grep -q '多链钱包雷达' wallet-radar/main.py
          grep -q 'chain_id=999\|999' wallet-radar/main.py || true

      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 记录 HyperEVM 只读状态
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null | sort > /tmp/wallet-radar-hyper-before.txt || true
            echo "HyperEVM 状态已只读记录，不执行任何修改。"
          '

      - name: 安装到独立目录
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            sudo mkdir -p /opt/wallet-radar
            sudo chown -R "$USER":"$(id -gn)" /opt/wallet-radar
          '

          rsync -az --delete \
            --exclude='.venv/' \
            --exclude='.env' \
            --exclude='*.csv' \
            --exclude='*.sqlite*' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "$SSH" \
            wallet-radar/ "$SERVER_USER@$SERVER_HOST:/opt/wallet-radar/"

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            cd /opt/wallet-radar
            python3 -m venv .venv
            .venv/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt

            touch .env
            chmod 600 .env

            set_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf "%s=%s\n" "$key" "$value" >> .env
              fi
            }

            # Robinhood 使用官方 RPC。PublicNode 的历史 eth_getLogs 会要求个人归档令牌并返回 403。
            set_env ROBINHOOD_RPC_URL https://rpc.mainnet.chain.robinhood.com
            set_env HYPEREVM_RPC_URL https://rpc.hyperliquid.xyz/evm
            set_env BNB_RPC_URL https://bsc-rpc.publicnode.com
            set_env REQUEST_TIMEOUT 30
            set_env RPC_BATCH_SIZE 50
            set_env WALLET_LABELS_FILE /opt/wallet-radar/labels.json

            # 只读取现有 Robinhood 环境中的 Telegram 凭据，复制到本程序；不修改来源文件。
            if sudo test -f /etc/robinhood-radar.env; then
              for key in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
                if ! grep -q "^${key}=." .env; then
                  value=$(sudo grep -m1 "^${key}=" /etc/robinhood-radar.env 2>/dev/null | cut -d= -f2- || true)
                  if [ -n "$value" ]; then
                    printf "%s=%s\n" "$key" "$value" >> .env
                  fi
                fi
              done
            fi

            .venv/bin/python -m py_compile main.py
            .venv/bin/python main.py --help | grep -q "多链钱包雷达"
            .venv/bin/python main.py selftest --all

            # 额外验证 Robinhood 历史日志能力，避免只检查最新区块却遗漏归档限制。
            .venv/bin/python - <<"PY"
          import os, requests
          rpc=os.environ.get("ROBINHOOD_RPC_URL", "https://rpc.mainnet.chain.robinhood.com")
          token="0xac46193ff2cb638bcfd02520e124a3e2c9228774"
          topic="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
          def call(method, params):
              r=requests.post(rpc,json={"jsonrpc":"2.0","id":1,"method":method,"params":params},timeout=20)
              r.raise_for_status()
              d=r.json()
              if d.get("error"):
                  raise RuntimeError(d["error"])
              return d.get("result")
          latest=int(call("eth_blockNumber", []),16)
          logs=call("eth_getLogs", [{"fromBlock":hex(max(0,latest-2000)),"toBlock":hex(latest),"address":token,"topics":[topic]}])
          print(f"ROBINHOOD_HISTORY_LOGS_OK={len(logs or [])}")
          PY

            echo "多链钱包雷达安装成功"
            echo "安装目录=/opt/wallet-radar"
          '

      - name: 最终隔离和三链验证
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            test -d /opt/wallet-radar
            test -x /opt/wallet-radar/.venv/bin/python
            test -f /opt/wallet-radar/main.py
            test -f /opt/wallet-radar/labels.json

            /opt/wallet-radar/.venv/bin/python /opt/wallet-radar/main.py selftest --all

            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null | sort > /tmp/wallet-radar-hyper-after.txt || true
            if [ -s /tmp/wallet-radar-hyper-before.txt ]; then
              diff -u /tmp/wallet-radar-hyper-before.txt /tmp/wallet-radar-hyper-after.txt
            fi
            echo "隔离检查通过：未修改或重启 HyperEVM Radar。"
            echo "安装完成：Robinhood + HyperEVM + BNB + 自定义 EVM 链模式。"
          '
