name: 测试BNB钱包雷达历史RPC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-bnb-history-rpc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 在服务器测试BNB历史日志RPC
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" 'python3 - <<"PY"
          import requests
          token="0xf5a248f6139f0ab0fab0c4dda6043b840f927777"
          topic="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
          urls=[
            "https://bsc-rpc.publicnode.com",
            "https://bsc-dataseed.bnbchain.org",
            "https://bsc-dataseed-public.bnbchain.org",
            "https://1rpc.io/bnb",
            "https://bsc.drpc.org",
            "https://bsc-mainnet.public.blastapi.io",
          ]
          for url in urls:
              print("===",url,"===", flush=True)
              s=requests.Session(); s.headers.update({"User-Agent":"WalletRadar/2.1","Content-Type":"application/json"})
              def rpc(method,params):
                  try:
                      r=s.post(url,json={"jsonrpc":"2.0","id":1,"method":method,"params":params},timeout=20)
                      print(method,"http",r.status_code, flush=True)
                      if r.status_code!=200:
                          print(r.text[:220], flush=True); return None
                      d=r.json()
                      if d.get("error"):
                          print("error",d.get("error"), flush=True); return None
                      return d.get("result")
                  except Exception as e:
                      print("exception",type(e).__name__,e, flush=True); return None
              cid=rpc("eth_chainId",[])
              latest=rpc("eth_blockNumber",[])
              print("chain",cid,"latest",latest, flush=True)
              if latest:
                  n=int(latest,16)
                  for span in (50,500,2000,10000):
                      res=rpc("eth_getLogs",[{"fromBlock":hex(max(0,n-span)),"toBlock":hex(n),"address":token,"topics":[topic]}])
                      if isinstance(res,list): print("span",span,"logs",len(res), flush=True)
          PY'
