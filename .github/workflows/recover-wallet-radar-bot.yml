name: 恢复钱包雷达电报服务

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-wallet-radar-bot.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 等待服务器恢复并只重启钱包雷达
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ServerAliveInterval=5 -o ServerAliveCountMax=2"
          ok=0
          for i in $(seq 1 12); do
            if $SSH "$SERVER_USER@$SERVER_HOST" 'echo SSH_OK' >/tmp/ssh.out 2>/tmp/ssh.err; then
              ok=1
              break
            fi
            echo "第 $i 次连接失败：$(tail -n 1 /tmp/ssh.err || true)"
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "服务器 SSH 仍不可达，未执行任何服务修改。"
            exit 1
          fi
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            echo "=== 恢复前 ==="
            systemctl is-active wallet-radar-bot.service || true
            ps -eo pid,ppid,etime,stat,cmd | grep -E "main.py analyze|wallet-radar/telegram_console.py" | grep -v grep || true
            # 只停止 wallet-radar 自己的分析子进程。锚定完整命令开头，避免匹配当前 SSH shell 自己。
            pids=$(pgrep -f "^/opt/wallet-radar/.venv/bin/python /opt/wallet-radar/main.py analyze( |$)" || true)
            if [ -n "$pids" ]; then
              kill $pids || true
              sleep 2
            fi
            sudo systemctl restart wallet-radar-bot.service
            sleep 5
            echo "=== 恢复后 ==="
            systemctl is-active wallet-radar-bot.service
            systemctl show wallet-radar-bot.service -p MainPID -p NRestarts --no-pager
            journalctl -u wallet-radar-bot.service --since "2 minutes ago" --no-pager | tail -n 80
            echo "=== HyperEVM 只读确认 ==="
            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null || true
          '
