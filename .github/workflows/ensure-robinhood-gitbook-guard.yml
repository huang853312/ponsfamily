name: Preserve Robinhood GitBook Identity Guard

on:
  workflow_run:
    workflows: ["Deploy Robinhood Chain Radar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current guard helper and regression test
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Stage guard files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SCP="scp -i $HOME/.ssh/deploy_key -P $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new"
          $SCP hyperevm-radar/tools/apply_gitbook_identity_guard.py "$SERVER_USER@$SERVER_HOST:/tmp/apply_gitbook_identity_guard.py"
          $SCP hyperevm-radar/tests/test_gitbook_identity_guard.py "$SERVER_USER@$SERVER_HOST:/tmp/test_gitbook_identity_guard.py"

      - name: Reapply and verify Robinhood guard
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            R=/opt/robinhood-radar/platform_family_intelligence.py
            test -f "$R"
            sudo cp "$R" /tmp/robin.before-gitbook-guard-reapply.py
            rollback(){ sudo cp /tmp/robin.before-gitbook-guard-reapply.py "$R" || true; sudo systemctl restart robinhood-radar.service || true; }
            trap rollback ERR
            sudo python3 /tmp/apply_gitbook_identity_guard.py "$R"
            grep -q SHARED_IDENTITY_HOSTS "$R"
            grep -q REJECTED_SHARED_PROVIDER_X "$R"
            cd /opt/robinhood-radar
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. .venv/bin/python /tmp/test_gitbook_identity_guard.py
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. .venv/bin/python - <<"PY"
          from platform_family_intelligence import derive_core_words, extract_core_word
          assert derive_core_words("tumble") == ["tum","tumb","tumbl"]
          assert extract_core_word("https://www.gitbook.com/") == ""
          PY
            sudo systemctl restart robinhood-radar.service
            sleep 8
            test "$(systemctl is-active robinhood-radar.service)" = active
            test "$(systemctl is-enabled robinhood-radar.service)" = enabled
            test "$(systemctl show robinhood-radar.service -p MainPID --value)" != "0"
            trap - ERR
          '
