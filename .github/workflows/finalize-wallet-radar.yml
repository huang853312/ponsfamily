name: 一次性完成钱包雷达低内存部署

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-wallet-radar.yml"
  workflow_dispatch:

concurrency:
  group: wallet-radar-finalize
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 本地语法与主逻辑等价测试
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check -q -r wallet-radar/requirements.txt
          python3 -m py_compile wallet-radar/main.py wallet-radar/main_fast.py wallet-radar/telegram_bot.py wallet-radar/telegram_console.py wallet-radar/test_fast_equivalence.py
          PYTHONPATH=wallet-radar python3 wallet-radar/test_fast_equivalence.py | tee /tmp/equivalence.log
          grep -q "EQUIVALENCE_OK" /tmp/equivalence.log
          grep -q "FundingWindowStats" wallet-radar/main_fast.py
          grep -q "查询报告回传当前聊天已启用" wallet-radar/telegram_console.py
          if grep -nE '(/opt/hyperevm-radar|systemctl (restart|stop|start) hyperevm-radar)' wallet-radar/main.py wallet-radar/main_fast.py wallet-radar/telegram_bot.py wallet-radar/telegram_console.py; then
            echo "发现对现有 HyperEVM Radar 的修改依赖，拒绝部署。"
            exit 1
          fi

      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 等待服务器可连接
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12"
          ok=0
          for i in $(seq 1 40); do
            if $SSH "$SERVER_USER@$SERVER_HOST" 'echo SSH_OK' >/tmp/ssh.out 2>/tmp/ssh.err; then ok=1; break; fi
            echo "第 $i 次等待服务器：$(tail -n 1 /tmp/ssh.err || true)"
            sleep 15
          done
          test "$ok" = 1

      - name: 部署并验证 Wallet Radar
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          $SSH "$SERVER_USER@$SERVER_HOST" 'systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null | sort > /tmp/wallet-hyper-before.txt || true'

          rsync -az --exclude='.venv/' --exclude='.env' --exclude='reports/' --exclude='*.csv' --exclude='*.sqlite*' --exclude='__pycache__/' --exclude='*.pyc' -e "$SSH" wallet-radar/ "$SERVER_USER@$SERVER_HOST:/opt/wallet-radar/"

          $SSH "$SERVER_USER@$SERVER_HOST" '
            set -eu
            cd /opt/wallet-radar
            .venv/bin/python -m py_compile main.py main_fast.py telegram_bot.py telegram_console.py test_fast_equivalence.py
            PYTHONPATH=. .venv/bin/python test_fast_equivalence.py | tee /tmp/wallet-equivalence.log
            grep -q "EQUIVALENCE_OK" /tmp/wallet-equivalence.log
            .venv/bin/python main_fast.py selftest --all
            .venv/bin/python telegram_bot.py --check

            rm -f /tmp/wallet-radar-smoke.csv /tmp/wallet-radar-smoke.log
            timeout 240 .venv/bin/python main_fast.py analyze --chain bnb --token 0xf5a248f6139f0ab0fab0c4dda6043b840f927777 --top 10 --scan-hours 0.10 --funding-minutes 2 --return-minutes 2 --max-groups 2 --output /tmp/wallet-radar-smoke.csv > /tmp/wallet-radar-smoke.log 2>&1
            test -s /tmp/wallet-radar-smoke.csv
            grep -q "进度标记：25" /tmp/wallet-radar-smoke.log
            grep -q "进度标记：50" /tmp/wallet-radar-smoke.log
            grep -q "进度标记：75" /tmp/wallet-radar-smoke.log
            grep -q "进度标记：90" /tmp/wallet-radar-smoke.log

            sudo mkdir -p /etc/systemd/system/wallet-radar-bot.service.d
            cat > /tmp/wallet-radar-limits.conf <<"EOF"
          [Service]
          Nice=10
          CPUWeight=25
          IOWeight=25
          MemoryHigh=900M
          MemoryMax=1200M
          MemorySwapMax=1G
          OOMPolicy=stop
          TasksMax=96
          EOF
            sudo install -m 644 /tmp/wallet-radar-limits.conf /etc/systemd/system/wallet-radar-bot.service.d/limits.conf
            sudo systemctl daemon-reload
            sudo systemctl restart wallet-radar-bot.service
            sleep 6
            test "$(systemctl is-active wallet-radar-bot.service)" = active
            journalctl -u wallet-radar-bot.service --since "2 minutes ago" --no-pager | grep -q "低内存分析入口已启用"
            journalctl -u wallet-radar-bot.service --since "2 minutes ago" --no-pager | grep -q "真实阶段中文进度提示已启用"
            journalctl -u wallet-radar-bot.service --since "2 minutes ago" --no-pager | grep -q "查询报告回传当前聊天已启用"

            systemctl show hyperevm-radar.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager 2>/dev/null | sort > /tmp/wallet-hyper-after.txt || true
            diff -u /tmp/wallet-hyper-before.txt /tmp/wallet-hyper-after.txt
            test "$(systemctl is-active hyperevm-radar.service)" = active

            systemctl show wallet-radar-bot.service -p MemoryHigh -p MemoryMax -p MemorySwapMax -p CPUWeight -p IOWeight --no-pager
            free -h
            echo FINAL_WALLET_RADAR_OK
          '
