name: 只读检查钱包雷达状态

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-wallet-radar.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 只读查看钱包雷达
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$SERVER_USER@$SERVER_HOST" '
            echo "=== 服务 ==="
            systemctl is-active wallet-radar-bot.service || true
            systemctl show wallet-radar-bot.service -p MainPID -p NRestarts --no-pager || true
            echo "=== 进程 ==="
            ps -eo pid,ppid,etime,%cpu,%mem,stat,cmd | grep -E "wallet-radar/(telegram_console.py|main.py analyze)" | grep -v grep || true
            echo "=== 资源 ==="
            free -h || true
            uptime || true
            echo "=== 最近日志 ==="
            journalctl -u wallet-radar-bot.service --since "10 minutes ago" --no-pager | tail -n 120 || true
            echo "=== HyperEVM 只读 ==="
            systemctl is-active hyperevm-radar.service || true
          '
