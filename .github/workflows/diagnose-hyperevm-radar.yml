name: Diagnose HyperEVM Radar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-hyperevm-radar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only HyperEVM diagnostics
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" '
              set -u
              echo "=== SERVICE ==="
              sudo systemctl is-active hyperevm-radar.service || true
              sudo systemctl show hyperevm-radar.service -p ExecStart -p WorkingDirectory -p EnvironmentFiles --no-pager || true

              echo "=== TELEGRAM ENV ==="
              PID=$(sudo systemctl show -p MainPID --value hyperevm-radar.service)
              if sudo sh -c "tr '\''\\0'\'' '\''\\n'\'' < /proc/$PID/environ | grep -q '\''^TELEGRAM_BOT_TOKEN=.'\''"; then echo "PROCESS_TELEGRAM_BOT_TOKEN=PRESENT"; else echo "PROCESS_TELEGRAM_BOT_TOKEN=MISSING"; fi
              if sudo sh -c "tr '\''\\0'\'' '\''\\n'\'' < /proc/$PID/environ | grep -q '\''^TELEGRAM_CHAT_ID=.'\''"; then echo "PROCESS_TELEGRAM_CHAT_ID=PRESENT"; else echo "PROCESS_TELEGRAM_CHAT_ID=MISSING"; fi

              echo "=== RECENT RADAR LOGS ==="
              sudo journalctl -u hyperevm-radar.service --since "60 minutes ago" --no-pager | grep -E "Platform candidate|Platform cluster candidate|Platform identity refresh|Platform identity confirmed|Telegram|contract error|B-level" | tail -n 160 || true

              echo "=== DB SUMMARY ==="
              cd /opt/hyperevm-radar
              /opt/hyperevm-radar/.venv/bin/python -c "import sqlite3,json; c=sqlite3.connect('\''data/radar.db'\''); names={r[0] for r in c.execute('\''select name from sqlite_master where type=\"table\"'\'')}; tables=['\''contracts'\'','\''platform_candidates'\'','\''platform_families'\'','\''platform_family_intelligence'\'','\''platform_identity_investigations'\'']; [print(t+'\''='\''+(str(c.execute('\''select count(*) from '\''+t).fetchone()[0]) if t in names else '\''NO_TABLE'\'')) for t in tables]; print('\''INVESTIGATION_STATUS'\'', c.execute('\''select verification_status,count(*) from platform_identity_investigations group by verification_status'\'').fetchall()); rows=c.execute('\''select subject_key,verification_status,result from platform_identity_investigations order by updated_at desc limit 12'\'').fetchall(); [print('\''INV'\'',r[0],r[1],{k:v for k,v in json.loads(r[2]).items() if k in ('\''project_name'\'','\''official_website'\'','\''official_x'\'','\''verification_method'\'','\''confidence'\'','\''core_word'\'','\''derived_words'\'','\''token_status'\'')}) for r in rows]" || true
            '
