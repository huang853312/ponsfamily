name: Diagnose HyperEVM Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hyperevm-radar.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Read-only server health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set +e
          SERVICE=hyperevm-radar.service
          echo '=== SERVICE ==='
          sudo systemctl is-active "$SERVICE" || true
          sudo systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p NRestarts || true
          PID=$(sudo systemctl show "$SERVICE" -p MainPID --value 2>/dev/null)

          echo '=== PROCESS ENV ==='
          if [ -n "$PID" ] && [ "$PID" != "0" ]; then
            ENV_DATA=$(sudo tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null)
            for K in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID HYPEREVM_SEARCH_API_URL HYPEREVM_SEARCH_API_KEY; do
              if printf '%s\n' "$ENV_DATA" | grep -q "^${K}=."; then
                echo "${K}=PRESENT"
              else
                echo "${K}=MISSING"
              fi
            done

            TOKEN=$(printf '%s\n' "$ENV_DATA" | sed -n 's/^TELEGRAM_BOT_TOKEN=//p' | head -n1)
            if [ -n "$TOKEN" ]; then
              HTTP=$(curl -sS -o /tmp/tg-getme.json -w '%{http_code}' --max-time 10 "https://api.telegram.org/bot${TOKEN}/getMe" || true)
              echo "TELEGRAM_GETME_HTTP=${HTTP}"
              python3 - <<'PY' 2>/dev/null || true
import json
p='/tmp/tg-getme.json'
try:
    d=json.load(open(p))
    print('TELEGRAM_GETME_OK=', d.get('ok'))
    print('TELEGRAM_BOT_USERNAME=', (d.get('result') or {}).get('username'))
except Exception as e:
    print('TELEGRAM_GETME_PARSE_ERROR=', type(e).__name__)
PY
            fi
          else
            echo 'PROCESS_ENV=UNAVAILABLE'
          fi

          echo '=== RECENT LOGS ==='
          sudo journalctl -u "$SERVICE" --since '30 minutes ago' --no-pager -n 200 || true

          echo '=== RADAR FILES ==='
          cd /opt/hyperevm-radar 2>/dev/null || exit 0
          pwd
          ls -l main.py platform_family_intelligence.py notifier.py 2>/dev/null || true

          echo '=== DATABASE RECENCY ==='
          python3 - <<'PY' 2>/dev/null || true
import os, sqlite3
p='/opt/hyperevm-radar/data/radar.db'
print('DB_EXISTS=', os.path.exists(p))
if os.path.exists(p):
    c=sqlite3.connect(p)
    tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
    print('HAS_IDENTITY_INVESTIGATIONS=', 'platform_identity_investigations' in tables)
    if 'platform_identity_investigations' in tables:
        rows=c.execute('select subject_key, verification_status, updated_at from platform_identity_investigations order by updated_at desc limit 10').fetchall()
        print('RECENT_INVESTIGATIONS=', rows)
PY
          REMOTE
