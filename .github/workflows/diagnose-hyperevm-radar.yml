name: Diagnose HyperEVM Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hyperevm-radar.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Read-only server health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set +e
          SERVICE=hyperevm-radar.service
          echo '=== SERVICE ==='
          sudo systemctl is-active "$SERVICE" || true
          sudo systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p NRestarts || true
          PID=$(sudo systemctl show "$SERVICE" -p MainPID --value 2>/dev/null)

          echo '=== PROCESS ==='
          if [ -n "$PID" ] && [ "$PID" != "0" ]; then
            ps -p "$PID" -o pid=,etime=,%cpu=,%mem=,cmd= || true
          fi

          echo '=== PROCESS ENV ==='
          if [ -n "$PID" ] && [ "$PID" != "0" ]; then
            ENV_DATA=$(sudo tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null)
            for K in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID HYPEREVM_SEARCH_API_URL HYPEREVM_SEARCH_API_KEY; do
              if printf '%s\n' "$ENV_DATA" | grep -q "^${K}=."; then
                echo "${K}=PRESENT"
              else
                echo "${K}=MISSING"
              fi
            done
            TOKEN=$(printf '%s\n' "$ENV_DATA" | sed -n 's/^TELEGRAM_BOT_TOKEN=//p' | head -n1)
            CHAT=$(printf '%s\n' "$ENV_DATA" | sed -n 's/^TELEGRAM_CHAT_ID=//p' | head -n1)
            if [ -n "$TOKEN" ]; then
              HTTP=$(curl -sS -o /tmp/tg-getme.json -w '%{http_code}' --max-time 10 "https://api.telegram.org/bot${TOKEN}/getMe" || true)
              echo "TELEGRAM_GETME_HTTP=${HTTP}"
              grep -o '"ok":[^,}]*' /tmp/tg-getme.json | head -n1 || true
              if [ -n "$CHAT" ]; then
                HTTP2=$(curl -sS -o /tmp/tg-getchat.json -w '%{http_code}' --max-time 10 --get --data-urlencode "chat_id=${CHAT}" "https://api.telegram.org/bot${TOKEN}/getChat" || true)
                echo "TELEGRAM_GETCHAT_HTTP=${HTTP2}"
                grep -o '"ok":[^,}]*' /tmp/tg-getchat.json | head -n1 || true
              fi
            fi
          else
            echo 'PROCESS_ENV=UNAVAILABLE'
          fi

          echo '=== RECENT LOGS ==='
          sudo journalctl -u "$SERVICE" --since '12 hours ago' --no-pager -n 1200 || true

          echo '=== RADAR FILES ==='
          cd /opt/hyperevm-radar 2>/dev/null || exit 0
          pwd
          ls -l main.py platform_family_intelligence.py notifier.py 2>/dev/null || true

          echo '=== DATABASE ==='
          if [ -f /opt/hyperevm-radar/data/radar.db ]; then
            echo 'DB_EXISTS=YES'
            stat -c 'DB_MTIME=%y DB_SIZE=%s' /opt/hyperevm-radar/data/radar.db || true
          else
            echo 'DB_EXISTS=NO'
          fi

          echo '=== DATABASE DEEP DIVE ==='
          python3 - <<'PY'
          import sqlite3, os, json, time, datetime
          p='/opt/hyperevm-radar/data/radar.db'
          if not os.path.exists(p):
              print('NO_DB')
              raise SystemExit
          c=sqlite3.connect(p)
          c.row_factory=sqlite3.Row
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          print('TABLES=', tables)
          wanted=['contracts','platform_candidates','platform_families','platform_family_members','platform_identity_investigations','platform_family_intelligence','platform_brands','platform_token_matches','standalone_identity_seeds']
          for t in wanted:
              if t not in tables:
                  print(f'TABLE {t}: MISSING')
                  continue
              cols=[r[1] for r in c.execute(f'pragma table_info({t})')]
              cnt=c.execute(f'select count(*) from {t}').fetchone()[0]
              print(f'TABLE {t}: COUNT={cnt} COLS={cols}')
              order=None
              for k in ['updated_at','first_seen_time','first_seen','created_at','last_block','first_block','block_number','id']:
                  if k in cols:
                      order=k
                      break
              sql=f'select * from {t}'
              if order:
                  sql+=f' order by {order} desc'
              sql+=' limit 12'
              try:
                  rows=[dict(r) for r in c.execute(sql).fetchall()]
                  safe=[]
                  for r in rows:
                      d={}
                      for k,v in r.items():
                          if isinstance(v,(bytes,bytearray)):
                              d[k]=f'<bytes:{len(v)}>'
                          elif isinstance(v,str) and len(v)>900:
                              d[k]=v[:900]+'...<truncated>'
                          else:
                              d[k]=v
                      safe.append(d)
                  print(f'RECENT {t}=', json.dumps(safe, ensure_ascii=False))
              except Exception as e:
                  print(f'RECENT {t} ERROR=', type(e).__name__, str(e))
          if 'platform_identity_investigations' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(platform_identity_investigations)')]
              if 'verification_status' in cols:
                  print('IDENTITY_STATUS_COUNTS=', [tuple(r) for r in c.execute('select verification_status,count(*) from platform_identity_investigations group by verification_status order by count(*) desc')])
          if 'platform_candidates' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(platform_candidates)')]
              for field in ['status','platform_type','discovery_source']:
                  if field in cols:
                      print(field.upper()+'_COUNTS=', c.execute(f'select {field},count(*) from platform_candidates group by {field} order by count(*) desc limit 20').fetchall())
          print('=== IDENTITY CAUSE EVIDENCE ===')
          for key in ['family:12','family:16','family:36','family:49']:
              row=c.execute('select * from platform_identity_investigations where subject_key=?',(key,)).fetchone()
              if not row: continue
              d=dict(row); result=json.loads(d.pop('result') or '{}')
              print('CAUSE_STATE=',json.dumps(d,ensure_ascii=False))
              print('CAUSE_RESULT=',json.dumps({k:result.get(k) for k in ['subject_key','official_website','official_x','verification_status','docs']},ensure_ascii=False))
              for e in result.get('evidence',[]):
                  if e.get('source') in ['search','direct_docs','website','x_public'] or e.get('kind') in ['DOCS_CANDIDATE','CROSS_VERIFICATION']:
                      print('CAUSE_EVIDENCE=',json.dumps({'subject':key,**e},ensure_ascii=False))
          import ast
          from pathlib import Path
          for fn,names in [('platform_family_intelligence.py',['_is_docs_url']),('database.py',['save_platform_identity_investigation']),('main.py',['_identity_pending_families'])]:
              source=Path('/opt/hyperevm-radar/'+fn).read_text()
              for n in ast.walk(ast.parse(source)):
                  if isinstance(n,ast.FunctionDef) and n.name in names:
                      print('PRODUCTION_FUNCTION=',fn,n.name)
                      print(''.join(source.splitlines(keepends=True)[n.lineno-1:n.end_lineno]))
          print('NOW_EPOCH=', int(time.time()), 'NOW=', datetime.datetime.now().isoformat())
          PY
          REMOTE
          # manual diagnostic trigger: 2026-09-13T04:00+08:00

# Read-only post-search-fix diagnostic: 2026-09-14

# User-requested runtime verification after API repair

# Fresh HyperEVM runtime check 1789339078528

# Twelve-hour notification investigation 1789339710939

# Post identity safety verification 1789341405773

# Detailed cause inspection 1789341570738

# Fresh post-quality verification 1789342122571
