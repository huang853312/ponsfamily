name: Deploy Multi-Chain Auto Trader (inactive)

on:
  push:
    branches:
      - feature/multi-chain-auto-trader
    paths:
      - 'multi-chain-auto-trader/**'
      - '.github/workflows/deploy-multi-chain-auto-trader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-multi-chain-auto-trader
  cancel-in-progress: false

jobs:
  test-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-chain-auto-trader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        working-directory: multi-chain-auto-trader
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app tests
          PYTHONPATH=. pytest -q
          bash -n deploy.sh
      - name: Load deployment SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Install isolated files on VPS (do not start trading service)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          ssh-add -l
          ssh_args=(-p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          target="$SERVER_USER@$SERVER_HOST"
          stage=$(ssh "${ssh_args[@]}" "$target" 'mktemp -d /tmp/multi-chain-auto-trader.XXXXXXXX')
          [[ "$stage" =~ ^/tmp/multi-chain-auto-trader\\.[A-Za-z0-9]+$ ]]
          cleanup() {
            ssh "${ssh_args[@]}" "$target" "sudo rm -rf -- '$stage'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          tar -C multi-chain-auto-trader -czf - . | ssh "${ssh_args[@]}" "$target" "tar -xzf - -C '$stage'"
          ssh "${ssh_args[@]}" "$target" "sudo bash '$stage/deploy.sh'"
