name: 测试BNB历史深度RPC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-bnb-archive-depth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 配置服务器连接
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: 测试小区间历史深度
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_USER@$SERVER_HOST" 'python3 - <<"PY"
          import requests
          token="0xf5a248f6139f0ab0fab0c4dda6043b840f927777"
          topic="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
          urls=[
            "https://bsc-rpc.publicnode.com",
            "https://bsc.drpc.org",
            "https://bsc-mainnet.public.blastapi.io",
            "https://gnfd-bsc-archiver-mainnet.bnbchain.org/",
          ]
          for url in urls:
              print("===",url,"===",flush=True)
              s=requests.Session(); s.headers.update({"User-Agent":"WalletRadar/2.1","Content-Type":"application/json"})
              def call(method,params):
                  try:
                      r=s.post(url,json={"jsonrpc":"2.0","id":1,"method":method,"params":params},timeout=20)
                      if r.status_code!=200:
                          return False,f"http={r.status_code} {r.text[:160]}"
                      d=r.json()
                      if d.get("error"): return False,str(d.get("error"))
                      return True,d.get("result")
                  except Exception as e: return False,f"{type(e).__name__}: {e}"
              ok,latest=call("eth_blockNumber",[])
              print("latest",ok,latest,flush=True)
              if not ok: continue
              n=int(latest,16)
              for depth in (1000,10000,100000,500000):
                  end=max(0,n-depth); start=max(0,end-49)
                  ok,res=call("eth_getLogs",[{"fromBlock":hex(start),"toBlock":hex(end),"address":token,"topics":[topic]}])
                  print("depth",depth,"ok",ok,"result",len(res) if ok and isinstance(res,list) else str(res)[:220],flush=True)
          PY'
